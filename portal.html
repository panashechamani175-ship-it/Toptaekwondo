<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOP TKD - Admin Panel</title>
    <style>
        :root { --red: #d32f2f; --black: #1a1a1a; --yellow: #ffc107; --bg: #f5f5f5; --green: #4caf50; }
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
      .admin-header { background: linear-gradient(135deg, var(--black), var(--red)); color: white; padding: 25px; border-radius: 12px; border-left: 6px solid var(--yellow); margin-bottom: 25px; }
      .admin-header h1 { margin: 0; color: var(--yellow); }
      .logout { background: rgba(255,255,255,0.2); color: white; border: 1px solid white; float: right; width: auto; padding: 8px 18px; cursor: pointer; border-radius: 8px; font-weight: bold; }
      .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
       @media (max-width: 900px) {.admin-grid { grid-template-columns: 1fr; }}
      .admin-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 3px 10px rgba(0,0,0,0.08); }
      .admin-card h3 { color: var(--red); margin-top: 0; border-bottom: 2px solid var(--yellow); padding-bottom: 8px; }
      .section-title { font-weight: bold; color: var(--black); margin-top: 12px; margin-bottom: 5px; font-size: 0.9rem; }
        input, select, textarea, button { width: 100%; padding: 10px; margin: 6px 0; border-radius: 8px; border: 1px solid #ccc; font-size: 0.95rem; }
        button { background: var(--red); color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #b71c1c; }
        button.edit { background: #1976d2; }
        button.save { background: var(--green); }
        button.reg-paid { background: var(--green); }
      .student-row { padding: 12px; border: 1px solid #eee; margin-bottom: 10px; border-radius: 8px; background: #fafafa; }
      .student-row small { display: block; color: #555; margin-top: 3px; }
      .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
      .btn-group button { flex: 1; min-width: 120px; }
      .progress-bar { background: #e0e0e0; border-radius: 10px; height: 10px; margin-top: 5px; }
      .progress { background: var(--green); height: 10px; border-radius: 10px; }
      .fee-paid { color: var(--green); font-weight: bold; }
      .fee-due { color: var(--red); font-weight: bold; }
      .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); justify-content:center; align-items:center; z-index: 999; }
      .modal-content { background:white; padding:25px; border-radius:12px; width:90%; max-width:550px; max-height: 90vh; overflow-y: auto; }
    </style>
</head>
<body>
<div class="admin-header">
    <button class="logout" onclick="logout()">Logout</button>
    <h1>🥋 TOP TKD ADMIN PANEL</h1>
    <p>Welcome, <span id="adminName">Master Admin</span></p>
</div>
    
  

    <div class="admin-grid">
        <!-- ADD STUDENT -->
        <div class="admin-card">
            <h3>➕ Add New Student - From Website Form</h3>
            <div class="section-title">Student Information</div>
            <input type="text" id="sName" placeholder="Full Name">
            <input type="date" id="sDOB" placeholder="Date of Birth">
            <select id="sGender"><option value="">Select Gender</option><option>Male</option><option>Female</option></select>
            <input type="email" id="sEmail" placeholder="Student Email">
            <input type="tel" id="sPhone" placeholder="Student Phone">
            <select id="sBelt"><option value="">Select Belt Rank</option><option>White</option><option>Yellow</option><option>Orange</option><option>Green</option><option>Blue</option><option>Red</option><option>Black</option></select>
            <select id="sExperience"><option value="">Experience Level</option><option>No Experience</option><option>Some Experience</option><option>Experienced</option></select>

            <div class="section-title">Parent / Guardian</div>
            <input type="text" id="pName" placeholder="Parent/Guardian Full Name">
            <input type="tel" id="pPhone" placeholder="Parent Phone Number">
            <textarea id="pAddress" placeholder="Home Address" rows="2"></textarea>
            <input type="tel" id="sEmergency" placeholder="Emergency Contact">

            <div class="section-title">Medical & Fees</div>
            <textarea id="sDiseases" placeholder="Diseases, Allergies, Injuries" rows="3"></textarea>
            <label><input type="checkbox" id="sRegPaid"> Registration Fee Paid $15</label>
            <input type="number" id="sFeePaid" placeholder="Monthly Fee Paid This Month $">

            <button onclick="addStudent()">Save Student Profile</button>
        </div>

        <!-- STATS -->
        <div class="admin-card">
            <h3>📊 Club Statistics</h3>
            <p><b>Total Students:</b> <span id="totalStudents">0</span></p>
            <p><b>Reg Fees Collected:</b> $<span id="totalReg">0</span></p>
            <p><b>Monthly Collected:</b> $<span id="totalCollected">0</span></p>
            <p><b>Monthly Due:</b> $<span id="totalDue">0</span></p>
        </div>

        <!-- ALL STUDENTS -->
        <div class="admin-card" style="grid-column: 1 / -1;">
            <h3>📋 All Student Profiles</h3>
            <div id="studentList">No students yet.</div>
        </div>
    </div>

    <!-- EDIT MODAL -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <h3>Edit Student</h3>
            <div id="editForm"></div>
            <button class="save" onclick="saveEdit()">Save Changes</button>
            <button onclick="closeModal()">Cancel</button>
        </div>
    </div>

<script>
    let students = JSON.parse(localStorage.getItem('tkdStudents')) || [];
    let editingId = null;
    const belts = ["White","Yellow","Orange","Green","Blue","Red","Black"];
    const REG_FEE = 15;

    function getMonthlyFee(dob) {
        const age = getAge(dob);
        return age < 18? 20 : 40; // Kids 20, Adults 40
    }

    function addStudent() {
        const student = {
            id: Date.now(),
            name: document.getElementById('sName').value.trim(),
            dob: document.getElementById('sDOB').value,
            gender: document.getElementById('sGender').value,
            email: document.getElementById('sEmail').value.trim(),
            phone: document.getElementById('sPhone').value.trim(),
            belt: document.getElementById('sBelt').value,
            beltProgress: 0,
            experience: document.getElementById('sExperience').value,
            parentName: document.getElementById('pName').value.trim(),
            parentPhone: document.getElementById('pPhone').value.trim(),
            parentAddress: document.getElementById('pAddress').value.trim(),
            emergency: document.getElementById('sEmergency').value.trim(),
            diseases: document.getElementById('sDiseases').value.trim(),
            regFeePaid: document.getElementById('sRegPaid').checked,
            feePaid: parseFloat(document.getElementById('sFeePaid').value) || 0,
            joinDate: new Date().toISOString().split('T')[0]
        };
        if(!student.name ||!student.dob) return alert("Enter Name and DOB");
        students.push(student);
        saveToStorage();
        loadStudents();
        alert(student.name + " added!");
        document.querySelectorAll('input, textarea, select').forEach(i => { if(i.type!== 'checkbox') i.value = ''; else i.checked = false; });
    }

    function loadStudents() {
        const list = document.getElementById('studentList');
        document.getElementById('totalStudents').textContent = students.length;
        
        let regTotal = 0, collected = 0, due = 0;
        students.forEach(s => {
            if(s.regFeePaid) regTotal += REG_FEE;
            const monthlyFee = getMonthlyFee(s.dob);
            collected += s.feePaid;
            due += (monthlyFee - s.feePaid);
        });
        document.getElementById('totalReg').textContent = regTotal;
        document.getElementById('totalCollected').textContent = collected;
        document.getElementById('totalDue').textContent = due < 0? 0 : due;

        if(students.length === 0) { list.innerHTML = "No students yet."; return; }

        list.innerHTML = students.map(s => {
            const monthlyFee = getMonthlyFee(s.dob);
            const remaining = monthlyFee - s.feePaid;
            const nextBelt = belts[belts.indexOf(s.belt) + 1] || "Max Rank";
            return `
            <div class="student-row">
                <div style="display:flex; justify-content:space-between;">
                    <b>${s.name}</b> - ${s.belt} Belt - ${s.gender} - Age: ${getAge(s.dob)}
                </div>
                <small><b>Email:</b> ${s.email} | <b>Phone:</b> ${s.phone}</small>
                <small><b>Parent:</b> ${s.parentName} | <b>Emergency:</b> ${s.emergency}</small>
                <small><b>Address:</b> ${s.parentAddress}</small>
                <small><b>Experience:</b> ${s.experience}</small>
                <small style="color:red;"><b>Medical:</b> ${s.diseases || 'None'}</small>
                
                <small><b>Reg Fee $15:</b> <span class="${s.regFeePaid? 'fee-paid' : 'fee-due'}">${s.regFeePaid? 'PAID' : 'NOT PAID'}</span></small>
                <small><b>Monthly Fee:</b> $${monthlyFee} | 
                    <span class="${s.feePaid >= monthlyFee? 'fee-paid' : 'fee-due'}">
                    Paid: $${s.feePaid} | Remaining: $${remaining > 0? remaining : 0}
                    </span>
                </small>

                <small><b>Next Belt:</b> ${nextBelt}</small>
                <div class="progress-bar"><div class="progress" style="width:${s.beltProgress}%"></div></div>

                <div class="btn-group">
                    <button class="edit" onclick="openEdit(${s.id})">Edit</button>
                    <button class="reg-paid" onclick="markRegPaid(${s.id})">${s.regFeePaid? 'Reg Paid' : 'Mark Reg $15'}</button>
                    <button onclick="deleteStudent(${s.id})">Delete</button>
                </div>
            </div>`;
        }).join('');
    }

    function markRegPaid(id) {
        const s = students.find(st => st.id === id);
        s.regFeePaid = true;
        saveToStorage();
        loadStudents();
    }

    function openEdit(id) {
        editingId = id;
        const s = students.find(st => st.id === id);
        document.getElementById('editForm').innerHTML = `
            <input type="text" id="editName" value="${s.name}">
            <input type="date" id="editDOB" value="${s.dob}">
            <select id="editGender"><option>${s.gender}</option><option>Male</option><option>Female</option></select>
            <input type="email" id="editEmail" value="${s.email}">
            <select id="editBelt">${belts.map(b => `<option ${s.belt===b?'selected':''}>${b}</option>`).join('')}</select>
            <label>Belt Progress %: <input type="range" id="editProgress" value="${s.beltProgress}" min="0" max="100"></label>
            <input type="number" id="editFee" value="${s.feePaid}" placeholder="Monthly Fee Paid">
            <textarea id="editMedical">${s.diseases}</textarea>
        `;
        document.getElementById('editModal').style.display = 'flex';
    }

    function saveEdit() {
        const s = students.find(st => st.id === editingId);
        s.name = document.getElementById('editName').value;
        s.dob = document.getElementById('editDOB').value;
        s.gender = document.getElementById('editGender').value;
        s.email = document.getElementById('editEmail').value;
        s.belt = document.getElementById('editBelt').value;
        s.beltProgress = parseInt(document.getElementById('editProgress').value);
        s.feePaid = parseFloat(document.getElementById('editFee').value) || 0;
        s.diseases = document.getElementById('editMedical').value;
        saveToStorage();
        loadStudents();
        closeModal();
    }

    function closeModal() { document.getElementById('editModal').style.display = 'none'; }
    function getAge(dob) { if(!dob) return '?'; return Math.floor((Date.now() - new Date(dob).getTime()) / (1000 * 60 * 60 * 24 * 365.25)); }
    function deleteStudent(id) { if(!confirm("Delete?")) return; students = students.filter(s => s.id!== id); saveToStorage(); loadStudents(); }
    function saveToStorage() { localStorage.setItem('tkdStudents', JSON.stringify(students)); }
    function logout() { window.location = 'index.html'; }

    loadStudents();
</script>
</body>
</html>
