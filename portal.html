<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOP TKD - Admin Portal</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --red:#c62828;
  --red-dark:#8e0000;
  --dark:#080808;
  --dark2:#171717;
  --yellow:#ffeb3b;
  --bg:#f1f1f1;
  --green:#00a651;
  --blue:#1976d2;
  --white:#fff;
  --gray:#666;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:20px;
  background:var(--bg);
  font-family:'Segoe UI',Arial,sans-serif;
  color:#222;
}

.admin-header{
  background:linear-gradient(135deg,#050505,#171717,#8e0000);
  color:#fff;
  padding:25px;
  border-radius:14px;
  border-left:6px solid var(--yellow);
  margin-bottom:20px;
  box-shadow:0 8px 25px rgba(0,0,0,.2);
}

.admin-header h1{
  margin:0;
  color:var(--yellow);
}

.admin-header p{
  margin-bottom:0;
}

.logout{
  float:right;
  background:rgba(255,255,255,.15);
  color:#fff;
  border:1px solid #fff;
  padding:9px 18px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
  width:auto;
  margin:0;
}

.admin-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

@media(max-width:900px){
  .admin-grid{
    grid-template-columns:1fr;
  }
}

.card{
  background:#fff;
  padding:20px;
  border-radius:14px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
  border-top:4px solid var(--red);
}

.full{
  grid-column:1/-1;
}

.card h2,
.card h3{
  color:var(--red);
  margin-top:0;
  border-bottom:2px solid var(--yellow);
  padding-bottom:8px;
}

label{
  display:block;
  font-weight:bold;
  margin-top:10px;
  font-size:14px;
}

input,
select,
textarea,
button{
  width:100%;
  padding:11px;
  margin-top:6px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:15px;
}

textarea{
  resize:vertical;
}

button{
  border:none;
  background:var(--red);
  color:#fff;
  font-weight:bold;
  cursor:pointer;
  transition:.2s;
}

button:hover{
  opacity:.9;
  transform:translateY(-1px);
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
  transform:none;
}

.btn-blue{
  background:var(--blue);
}

.btn-green{
  background:var(--green);
}

.btn-dark{
  background:var(--dark);
}

.btn-danger{
  background:#9b0000;
}

.dob-group{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
}

.checkbox-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:12px;
}

.checkbox-row input{
  width:auto;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

@media(max-width:700px){
  .stats{
    grid-template-columns:1fr 1fr;
  }
}

.stat{
  padding:15px;
  background:#fafafa;
  border-radius:10px;
  border-left:5px solid var(--red);
}

.stat strong{
  display:block;
  font-size:24px;
  margin-top:5px;
}

.search{
  margin-bottom:15px;
}

.student-row{
  background:#fafafa;
  border:1px solid #ddd;
  border-radius:12px;
  padding:15px;
  margin-bottom:12px;
}

.student-row h3{
  margin:0 0 8px;
  color:var(--dark);
  border:0;
}

.student-info{
  color:#555;
  font-size:14px;
  line-height:1.8;
}

.button-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

.button-row button{
  width:auto;
  flex:1;
  min-width:100px;
}

.message{
  padding:12px;
  border-radius:8px;
  margin-bottom:12px;
  display:none;
}

.success{
  background:#dff5e2;
  color:#176b20;
}

.error{
  background:#ffdede;
  color:#a00000;
}

.warning{
  background:#fff4cc;
  color:#705500;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  z-index:1000;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal-content{
  background:#fff;
  width:100%;
  max-width:650px;
  max-height:90vh;
  overflow-y:auto;
  border-radius:14px;
  padding:20px;
}

.close{
  background:#555;
}

.loading{
  text-align:center;
  padding:20px;
  color:#666;
}

/* BELTS */

.belt-badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:4px 9px;
  border-radius:20px;
  background:#fff;
  border:1px solid #ccc;
  font-weight:800;
  color:#111;
}

.belt-bar{
  display:inline-block;
  width:42px;
  height:11px;
  border-radius:3px;
  border:1px solid #999;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.25);
}

.belt-white{
  background:#fff;
}

.belt-yellow{
  background:#ffeb3b;
}

.belt-green{
  background:#20a020;
}

.belt-blue{
  background:#1674d1;
}

.belt-red{
  background:#d00000;
}

.belt-black{
  background:#111;
  border-color:#555;
}

.badge{
  display:inline-block;
  padding:3px 8px;
  border-radius:12px;
  font-size:12px;
  font-weight:bold;
}

.badge.active{
  background:#dff5e2;
  color:#176b20;
}

.badge.inactive{
  background:#eee;
  color:#555;
}

.badge.suspended{
  background:#ffdede;
  color:#a00000;
}

.badge.graduated{
  background:#e0eaff;
  color:#174c9c;
}

.required{
  color:#a00000;
}
</style>
</head>

<body>

<div id="message" class="message"></div>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://ohrzdhpttcxisiwmesxp.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_blBKBN-cs_QuSf2XxGPlAw_bdzgS58_";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =====================================================
   GLOBALS
===================================================== */

let students = [];

let editingId = null;

const REG_FEE = 15;

const months = {
  Jan:"01",
  Feb:"02",
  Mar:"03",
  Apr:"04",
  May:"05",
  Jun:"06",
  Jul:"07",
  Aug:"08",
  Sep:"09",
  Oct:"10",
  Nov:"11",
  Dec:"12"
};


/* =====================================================
   PAGE START
===================================================== */

window.addEventListener(
  "load",
  async () => {

    createDOBOptions();

    const isAdmin =
      await checkAdmin();

    if(!isAdmin){
      return;
    }

    await loadStudents();

  }
);


/* =====================================================
   DOB OPTIONS
===================================================== */

function createDOBOptions(){

  const day =
    document.getElementById("sDay");

  const month =
    document.getElementById("sMonth");

  const year =
    document.getElementById("sYear");


  for(let i=1;i<=31;i++){

    day.innerHTML +=
      `<option value="${i}">${i}</option>`;

  }


  Object.keys(months).forEach(m => {

    month.innerHTML +=
      `<option value="${m}">${m}</option>`;

  });


  const currentYear =
    new Date().getFullYear();


  for(
    let i=currentYear;
    i>=1950;
    i--
  ){

    year.innerHTML +=
      `<option value="${i}">${i}</option>`;

  }

}


/* =====================================================
   GET DOB
===================================================== */

function getDOB(){

  const d =
    document.getElementById("sDay").value;

  const m =
    document.getElementById("sMonth").value;

  const y =
    document.getElementById("sYear").value;


  if(!d || !m || !y){
    return null;
  }


  return `${y}-${months[m]}-${String(d).padStart(2,"0")}`;

}


/* =====================================================
   AGE
===================================================== */

function getAge(dob){

  if(!dob){
    return 0;
  }


  const birth =
    new Date(dob);

  const today =
    new Date();


  let age =
    today.getFullYear() -
    birth.getFullYear();


  const monthDifference =
    today.getMonth() -
    birth.getMonth();


  if(
    monthDifference < 0 ||
    (
      monthDifference === 0 &&
      today.getDate() < birth.getDate()
    )
  ){

    age--;

  }


  return age;

}


/* =====================================================
   MONTHLY FEE
===================================================== */

function getMonthlyFee(dob){

  return getAge(dob) < 20
    ? 20
    : 40;

}


/* =====================================================
   ADMIN CHECK
===================================================== */

async function checkAdmin(){

  try{

    const {
      data:{user},
      error:userError
    } =
      await supabaseClient.auth.getUser();


    if(
      userError ||
      !user
    ){

      location.href =
        "index.html";

      return false;

    }


    const {
      data:profile,
      error
    } =
      await supabaseClient
        .from("profiles")
        .select("full_name,role")
        .eq("id",user.id)
        .single();


    if(error){

      showMessage(
        "Unable to verify admin account: " +
        error.message,
        "error"
      );

      return false;

    }


    if(
      !profile ||
      profile.role !== "admin"
    ){

      alert(
        "Access denied. Admin account required."
      );

      await supabaseClient.auth.signOut();

      location.href =
        "index.html";

      return false;

    }


    document.getElementById(
      "adminName"
    ).textContent =
      profile.full_name ||
      "Master Admin";


    return true;

  }catch(error){

    console.error(error);

    showMessage(
      "Unable to verify admin account.",
      "error"
    );

    return false;

  }

}


/* =====================================================
   ADD STUDENT
===================================================== */

async function addStudent(){

  const button =
    document.getElementById(
      "saveStudentButton"
    );


  const name =
    document.getElementById(
      "sName"
    ).value.trim();


  const dob =
    getDOB();


  const phone =
    document.getElementById(
      "sPhone"
    ).value.trim();


  const email =
    document.getElementById(
      "sEmail"
    ).value.trim();


  const emergencyContact =
    document.getElementById(
      "sEmergency"
    ).value.trim();


  const experience =
    document.getElementById(
      "sExperience"
    ).value.trim();


  if(!name || !dob){

    alert(
      "Please enter the student's name and date of birth."
    );

    return;

  }


  /*
    These columns are NOT NULL
    in your actual students table.
  */

  if(!phone){

    alert(
      "Please enter the student's phone number."
    );

    return;

  }


  if(!email){

    alert(
      "Please enter the student's email."
    );

    return;

  }


  if(!emergencyContact){

    alert(
      "Please enter the emergency contact."
    );

    return;

  }


  if(!experience){

    alert(
      "Please select the student's experience level."
    );

    return;

  }


  const registrationPaid =
    document.getElementById(
      "sRegPaid"
    ).checked;


  const monthlyPaid =
    parseFloat(
      document.getElementById(
        "sFeePaid"
      ).value
    ) || 0;


  const {
    data:{user},
    error:userError
  } =
    await supabaseClient.auth.getUser();


  if(
    userError ||
    !user
  ){

    alert(
      "Your admin session has expired."
    );

    location.href =
      "index.html";

    return;

  }


  /*
    IMPORTANT:

    registration_fee       = NUMBER 15
    registration_fee_paid  = BOOLEAN true/false

    They are separate database columns.
  */

  const studentData = {

    /* Required existing columns */

    student_name:
      name,

    date_of_birth:
      dob,

    phone:
      phone,

    email:
      email,

    emergency_contact:
      emergencyContact,

    experience:
      experience,


    /* Existing application fields */

    parent_guardian:
      document.getElementById(
        "pName"
      ).value.trim() || null,

    parent_name:
      document.getElementById(
        "pName"
      ).value.trim() || null,

    parent_phone:
      document.getElementById(
        "pPhone"
      ).value.trim() || null,

    parent_address:
      document.getElementById(
        "pAddress"
      ).value.trim() || null,

    medical_notes:
      document.getElementById(
        "sMedical"
      ).value.trim() || null,


    /* Belt */

    belt:
      document.getElementById(
        "sBelt"
      ).value || "White Belt",

    belt_rank:
      document.getElementById(
        "sBelt"
      ).value || "White",


    /* Newer admin fields */

    gender:
      document.getElementById(
        "sGender"
      ).value || null,

    parent_guardian_name:
      document.getElementById(
        "pName"
      ).value.trim() || null,

    guardian_name:
      document.getElementById(
        "pName"
      ).value.trim() || null,

    guardian_phone:
      document.getElementById(
        "pPhone"
      ).value.trim() || null,

    home_address:
      document.getElementById(
        "pAddress"
      ).value.trim() || null,

    medical_information:
      document.getElementById(
        "sMedical"
      ).value.trim() ||
      "None",

    experience_level:
      experience,

    student_email:
      email,

    student_phone:
      phone,

    join_date:
      new Date()
        .toISOString()
        .split("T")[0],


    /* Fees */

    registration_fee:
      REG_FEE,

    /*
      BOOLEAN ONLY
    */

    registration_fee_paid:
      registrationPaid,

    monthly_fee:
      getMonthlyFee(dob),

    monthly_fee_paid:
      monthlyPaid,

    registration_fee_paid_at:
      registrationPaid
        ? new Date().toISOString()
        : null,

    last_monthly_payment_at:
      monthlyPaid > 0
        ? new Date().toISOString()
        : null,


    /* Status */

    status:
      "active",


    /*
      Logged-in admin UUID.
    */

    user_id:
      user.id

  };


  console.log(
    "Student data being sent:",
    studentData
  );


  button.disabled = true;

  button.textContent =
    "Saving...";


  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .from("students")
        .insert(studentData)
        .select()
        .single();


    if(error){

      console.error(
        "ADD STUDENT ERROR:",
        error
      );

      showMessage(
        "Supabase error: " +
        error.message,
        "error"
      );

      return;

    }


    console.log(
      "Student created:",
      data
    );


    showMessage(
      `${name} was added successfully!`,
      "success"
    );


    clearStudentForm();

    await loadStudents();

  }finally{

    button.disabled = false;

    button.textContent =
      "💾 Save Student";

  }

}


/* =====================================================
   LOAD STUDENTS
===================================================== */

async function loadStudents(){

  const list =
    document.getElementById(
      "studentList"
    );


  list.innerHTML =
    '<div class="loading">Loading students...</div>';


  const {
    data,
    error
  } =
    await supabaseClient
      .from("students")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(error){

    console.error(error);

    showMessage(
      "Could not load students: " +
      error.message,
      "error"
    );

    list.innerHTML =
      "Unable to load students.";

    return;

  }


  students =
    data || [];


  updateStatistics();

  displayStudents();

}


/* =====================================================
   BELT CLASS
===================================================== */

function getBeltClass(belt){

  const value =
    String(
      belt || "White"
    ).toLowerCase();


  if(value.includes("yellow"))
    return "yellow";


  if(value.includes("green"))
    return "green";


  if(value.includes("blue"))
    return "blue";


  if(value.includes("red"))
    return "red";


  if(value.includes("black"))
    return "black";


  return "white";

}


/* =====================================================
   BELT HTML
===================================================== */

function beltHTML(belt){

  const label =
    belt || "White";


  return `
    <span class="belt-badge">

      <span
        class="belt-bar belt-${getBeltClass(label)}"
      ></span>

      ${escapeHTML(label)}

    </span>
  `;

}


/* =====================================================
   DISPLAY STUDENTS
===================================================== */

function displayStudents(){

  const list =
    document.getElementById(
      "studentList"
    );


  const search =
    document
      .getElementById(
        "searchStudent"
      )
      .value
      .toLowerCase()
      .trim();


  const filtered =
    students.filter(
      s => {

        const name =
          String(
            s.student_name ||
            ""
          ).toLowerCase();


        const email =
          String(
            s.student_email ||
            s.email ||
            ""
          ).toLowerCase();


        const phone =
          String(
            s.student_phone ||
            s.phone ||
            ""
          ).toLowerCase();


        return (
          name.includes(search) ||
          email.includes(search) ||
          phone.includes(search)
        );

      }
    );


  if(!filtered.length){

    list.innerHTML =
      "No students found.";

    return;

  }


  list.innerHTML =
    filtered
      .map(
        s => {

          const fee =
            Number(
              s.monthly_fee
            ) || 0;


          const paid =
            Number(
              s.monthly_fee_paid
            ) || 0;


          const due =
            Math.max(
              0,
              fee - paid
            );


          const registration =
            s.registration_fee_paid
              ? REG_FEE
              : 0;


          const status =
            s.status ||
            "active";


          const email =
            s.student_email ||
            s.email ||
            "Not provided";


          const phone =
            s.student_phone ||
            s.phone ||
            "Not provided";


          const guardian =
            s.parent_guardian_name ||
            s.guardian_name ||
            s.parent_guardian ||
            s.parent_name ||
            "Not provided";


          const medical =
            s.medical_information ||
            s.medical_info ||
            s.medical_notes ||
            "None";


          const belt =
            s.belt_rank ||
            s.belt ||
            "White";


          return `

          <div
            class="student-row"
          >

            <h3>
              ${escapeHTML(
                s.student_name ||
                s.full_name ||
                "Unnamed Student"
              )}
            </h3>


            <div class="student-info">

              <b>Belt:</b>
              ${beltHTML(belt)}
              <br>


              <b>Age:</b>
              ${getAge(
                s.date_of_birth ||
                s.dob
              )}
              <br>


              <b>Gender:</b>
              ${escapeHTML(
                s.gender ||
                "Not provided"
              )}
              <br>


              <b>Email:</b>
              ${escapeHTML(email)}
              <br>


              <b>Phone:</b>
              ${escapeHTML(phone)}
              <br>


              <b>Guardian:</b>
              ${escapeHTML(guardian)}
              <br>


              <b>Emergency:</b>
              ${escapeHTML(
                s.emergency_contact ||
                "Not provided"
              )}
              <br>


              <b>Experience:</b>
              ${escapeHTML(
                s.experience_level ||
                s.experience ||
                "Not provided"
              )}
              <br>


              <b>Medical:</b>
              ${escapeHTML(medical)}
              <br>


              <b>Registration:</b>
              $${registration.toFixed(2)}

              ${
                s.registration_fee_paid
                  ? " — PAID"
                  : " — NOT PAID"
              }

              <br>


              <b>Monthly Fee:</b>
              $${fee.toFixed(2)}
              <br>


              <b>Monthly Paid:</b>
              $${paid.toFixed(2)}
              <br>


              <b>Monthly Due:</b>
              $${due.toFixed(2)}
              <br>


              <b>Status:</b>

              <span
                class="badge ${escapeAttribute(status)}"
              >
                ${escapeHTML(status)}
              </span>

            </div>


            <div class="button-row">

              <button
                class="btn-blue"
                onclick="openEdit('${escapeAttribute(s.id)}')"
              >
                ✏️ Edit
              </button>


              <button
                class="btn-danger"
                onclick="deleteStudent('${escapeAttribute(s.id)}')"
              >
                🗑 Delete
              </button>

            </div>

          </div>

          `;

        }
      )
      .join("");

}


/* =====================================================
   STATISTICS
===================================================== */

function updateStatistics(){

  let registrationTotal = 0;

  let collected = 0;

  let due = 0;


  students.forEach(
    s => {

      if(
        s.registration_fee_paid
      ){

        registrationTotal +=
          REG_FEE;

      }


      const fee =
        Number(
          s.monthly_fee
        ) || 0;


      const paid =
        Number(
          s.monthly_fee_paid
        ) || 0;


      collected +=
        paid;


      due +=
        Math.max(
          0,
          fee - paid
        );

    }
  );


  document.getElementById(
    "totalStudents"
  ).textContent =
    students.length;


  document.getElementById(
    "totalReg"
  ).textContent =
    registrationTotal.toFixed(2);


  document.getElementById(
    "totalCollected"
  ).textContent =
    collected.toFixed(2);


  document.getElementById(
    "totalDue"
  ).textContent =
    due.toFixed(2);

}


/* =====================================================
   EDIT STUDENT
===================================================== */

function openEdit(id){

  const student =
    students.find(
      x => String(x.id) === String(id)
    );


  if(!student){
    return;
  }


  editingId =
    id;


  const editForm =
    document.getElementById(
      "editForm"
    );


  const belt =
    student.belt_rank ||
    student.belt ||
    "White";


  const email =
    student.student_email ||
    student.email ||
    "";


  const phone =
    student.student_phone ||
    student.phone ||
    "";


  const guardian =
    student.parent_guardian_name ||
    student.guardian_name ||
    student.parent_guardian ||
    student.parent_name ||
    "";


  const medical =
    student.medical_information ||
    student.medical_info ||
    student.medical_notes ||
    "None";


  const experience =
    student.experience_level ||
    student.experience ||
    "";


  editForm.innerHTML = `

    <label>Student Name</label>

    <input
      id="editName"
      value="${escapeAttribute(
        student.student_name || ""
      )}"
    >


    <label>Email</label>

    <input
      id="editEmail"
      type="email"
      value="${escapeAttribute(email)}"
    >


    <label>Phone</label>

    <input
      id="editPhone"
      value="${escapeAttribute(phone)}"
    >


    <label>Emergency Contact</label>

    <input
      id="editEmergency"
      value="${escapeAttribute(
        student.emergency_contact || ""
      )}"
    >


    <label>Experience</label>

    <select id="editExperience">

      <option value="">Select Experience</option>

      <option
        value="No Experience"
        ${experience === "No Experience"
          ? "selected"
          : ""}
      >
        No Experience
      </option>

      <option
        value="Some Experience"
        ${experience === "Some Experience"
          ? "selected"
          : ""}
      >
        Some Experience
      </option>

      <option
        value="Experienced"
        ${experience === "Experienced"
          ? "selected"
          : ""}
      >
        Experienced
      </option>

    </select>


    <label>Belt Rank</label>

    <select id="editBelt">

      ${
        [
          "White",
          "Yellow",
          "Green",
          "Blue",
          "Red",
          "Black",
          "Black 1st Dan",
          "Black 2nd Dan",
          "Black 3rd Dan"
        ]
        .map(
          b => `

          <option
            value="${b}"
            ${
              belt === b
                ? "selected"
                : ""
            }
          >
            ${b}
          </option>

          `
        )
        .join("")
      }

    </select>


    <label>Status</label>

    <select id="editStatus">

      ${
        [
          "active",
          "inactive",
          "suspended",
          "graduated"
        ]
        .map(
          x => `

          <option
            value="${x}"
            ${
              student.status === x
                ? "selected"
                : ""
            }
          >
            ${x}
          </option>

          `
        )
        .join("")
      }

    </select>


    <label>Registration Fee Paid</label>

    <select
      id="editRegistrationPaid"
    >

      <option
        value="false"
        ${
          student.registration_fee_paid
            ? ""
            : "selected"
        }
      >
        Not Paid
      </option>

      <option
        value="true"
        ${
          student.registration_fee_paid
            ? "selected"
            : ""
        }
      >
        Paid ($15)
      </option>

    </select>


    <label>Monthly Fee</label>

    <input
      id="editMonthlyFee"
      type="number"
      min="0"
      step=".01"
      value="${Number(
        student.monthly_fee || 0
      )}"
    >


    <label>Monthly Fee Paid</label>

    <input
      id="editMonthlyPaid"
      type="number"
      min="0"
      step=".01"
      value="${Number(
        student.monthly_fee_paid || 0
      )}"
    >


    <label>Guardian Name</label>

    <input
      id="editGuardian"
      value="${escapeAttribute(

      )}"
    >


    <label>Guardian Phone</label>

      id="editGuardianPhone"

        student.guardian_phone ||
        ""

    >


    <label>Home Address</label>

    >${escapeHTML(

/* =====================================================
   SAVE EDIT
===================================================== */

async function saveEdit(){

  if(!editingId){

    alert(
      "No student selected."
    );

    return;

  }


  const name =
    document.getElementById(
      "editName"
    ).value.trim();


  const email =
    document.getElementById(
      "editEmail"
    ).value.trim();


  const phone =
    document.getElementById(
      "editPhone"
    ).value.trim();


  const emergency =
    document.getElementById(
      "editEmergency"
    ).value.trim();


  const experience =
    document.getElementById(
      "editExperience"
    ).value.trim();


  if(!name){

    alert(
      "Student name is required."
    );

    return;

  }


  if(!email){

    alert(
      "Student email is required."
    );

    return;

  }


  if(!phone){

    alert(
      "Student phone is required."
    );

    return;

  }


  if(!emergency){

    alert(
      "Emergency contact is required."
    );

    return;

  }


  if(!experience){

    alert(
      "Experience is required."
    );

    return;

  }


  const registrationPaid =
    document.getElementById(
      "editRegistrationPaid"
    ).value === "true";


  const monthlyFee =
    parseFloat(
      document.getElementById(
        "editMonthlyFee"
      ).value
    ) || 0;


  const monthlyPaid =
    parseFloat(
      document.getElementById(
        "editMonthlyPaid"
      ).value
    ) || 0;


  const belt =
    document.getElementById(
      "editBelt"
    ).value;


  const status =
    document.getElementById(
      "editStatus"
    ).value;


  const guardian =
    document.getElementById(
      "editGuardian"
    ).value.trim() ||
    null;


  const guardianPhone =
    document.getElementById(
      "editGuardianPhone"
    ).value.trim() ||
    null;


  const address =
    document.getElementById(
      "editAddress"
    ).value.trim() ||
    null;


  const medical =
    document.getElementById(
      "editMedical"
    ).value.trim() ||
    "None";


  const updates = {

    student_name:
      name,

    phone:
      phone,

    email:
      email,

    emergency_contact:
      emergency,

    experience:
      experience,

    student_phone:
      phone,

    student_email:
      email,

    emergency_contact:
      emergency,

    experience_level:
      experience,

    belt:
      belt,

    belt_rank:
      belt,

    registration_fee:
      REG_FEE,

    registration_fee_paid:
      registrationPaid,

    monthly_fee:
      monthlyFee,

    monthly_fee_paid:
      monthlyPaid,

    parent_guardian:
      guardian,

    parent_name:
      guardian,

    parent_guardian_name:
      guardian,

    guardian_name:
      guardian,

    parent_phone:
      guardianPhone,

    guardian_phone:
      guardianPhone,

    parent_address:
      address,

    home_address:
      address,

    medical_notes:
      medical,

    medical_info:
      medical,

    medical_information:
      medical,

    status:
      status,

    registration_fee_paid_at:
      registrationPaid
        ? new Date().toISOString()
        : null,

    last_monthly_payment_at:
      monthlyPaid > 0
        ? new Date().toISOString()
        : null

  };


  const button =
    document.getElementById(
      "saveEditButton"
    );


  button.disabled = true;

  button.textContent =
    "Saving...";


  try{

    const {
      error
    } =
      await supabaseClient
        .from("students")
        .update(updates)
        .eq("id",editingId);


    if(error){

      console.error(
        "EDIT ERROR:",
        error
      );

      alert(
        "Update failed: " +
        error.message
      );

      return;

    }


    closeModal();

    showMessage(
      "Student updated successfully.",
      "success"
    );


    await loadStudents();

  }finally{

    button.disabled = false;

    button.textContent =
      "Save Changes";

  }

}


/* =====================================================
   DELETE STUDENT
===================================================== */

async function deleteStudent(id){

  const student =
    students.find(
      x => String(x.id) === String(id)
    );


  if(!student){
    return;
  }


  const name =
    student.student_name ||
    student.full_name ||
    "this student";


  if(
    !confirm(
      `Delete ${name}? This cannot be undone.`
    )
  ){

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .from("students")
      .delete()
      .eq("id",id);


  if(error){

    console.error(
      "DELETE ERROR:",
      error
    );

    alert(
      "Delete failed: " +
      error.message
    );

    return;

  }


  showMessage(
    "Student deleted successfully.",
    "success"
  );


  await loadStudents();

}

/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

  await supabaseClient.auth.signOut();

  location.href =
    "index.html";

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
  text,
  type
){

  const message =
    document.getElementById(
      "message"
    );


  message.textContent =
    text;


  message.className =
    "message " + type;


  message.style.display =
    "block";


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });


  setTimeout(
    () => {

      message.style.display =
        "none";

    },
    5000
  );

}


/* =====================================================
   SECURITY / HTML HELPERS
===================================================== */

function escapeHTML(value){

  return String(value)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


function escapeAttribute(value){

  return escapeHTML(value);

}
