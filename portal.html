<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TOP TKD - Admin Panel</title>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
    --red:#d32f2f;
    --dark:#1a1a1a;
    --yellow:#ffc107;
    --bg:#f5f5f5;
    --green:#4caf50;
    --blue:#1976d2;
    --white:#fff;
    --gray:#666;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:var(--bg);
    font-family:'Segoe UI',Arial,sans-serif;
    color:#222;
}

.admin-header{
    background:linear-gradient(135deg,var(--dark),var(--red));
    color:white;
    padding:25px;
    border-radius:14px;
    border-left:6px solid var(--yellow);
    margin-bottom:20px;
}

.admin-header h1{
    margin:0;
    color:var(--yellow);
}

.admin-header p{
    margin-bottom:0;
}

.logout{
    float:right;
    background:rgba(255,255,255,.15);
    color:white;
    border:1px solid white;
    padding:9px 18px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.admin-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

@media(max-width:900px){
    .admin-grid{
        grid-template-columns:1fr;
    }
}

.card{
    background:white;
    padding:20px;
    border-radius:14px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.full{
    grid-column:1/-1;
}

.card h2,
.card h3{
    color:var(--red);
    margin-top:0;
    border-bottom:2px solid var(--yellow);
    padding-bottom:8px;
}

label{
    display:block;
    font-weight:bold;
    margin-top:10px;
    font-size:14px;
}

input,
select,
textarea,
button{
    width:100%;
    padding:11px;
    margin-top:6px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:15px;
}

textarea{
    resize:vertical;
}

button{
    border:none;
    background:var(--red);
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.btn-blue{
    background:var(--blue);
}

.btn-green{
    background:var(--green);
}

.btn-dark{
    background:var(--dark);
}

.btn-danger{
    background:#b71c1c;
}

.dob-group{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:8px;
}

.checkbox-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:12px;
}

.checkbox-row input{
    width:auto;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

@media(max-width:700px){
    .stats{
        grid-template-columns:1fr 1fr;
    }
}

.stat{
    padding:15px;
    background:#fafafa;
    border-radius:10px;
    border-left:4px solid var(--red);
}

.stat strong{
    display:block;
    font-size:24px;
    margin-top:5px;
}

.search{
    margin-bottom:15px;
}

.student-row{
    background:#fafafa;
    border:1px solid #ddd;
    border-radius:12px;
    padding:15px;
    margin-bottom:12px;
}

.student-row h3{
    margin:0 0 5px;
    color:var(--dark);
}

.student-info{
    color:#555;
    font-size:14px;
    line-height:1.6;
}

.badge{
    display:inline-block;
    padding:4px 8px;
    border-radius:20px;
    background:var(--yellow);
    color:#111;
    font-weight:bold;
    font-size:12px;
}

.active{
    background:#d8f5dc;
    color:#176b20;
}

.suspended{
    background:#ffd6d6;
    color:#9b0000;
}

.button-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:10px;
}

.button-row button{
    width:auto;
    flex:1;
    min-width:100px;
}

.message{
    padding:12px;
    border-radius:8px;
    margin-bottom:12px;
    display:none;
}

.success{
    background:#dff5e2;
    color:#176b20;
}

.error{
    background:#ffdede;
    color:#a00000;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.6);
    z-index:1000;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-content{
    background:white;
    width:100%;
    max-width:600px;
    max-height:90vh;
    overflow-y:auto;
    border-radius:14px;
    padding:20px;
}

.close{
    background:#555;
}

.loading{
    text-align:center;
    padding:20px;
    color:#666;
}
</style>
</head>

<body>

<div id="message" class="message"></div>

<header class="admin-header">

    <button class="logout" onclick="logout()">
        Logout
    </button>

    <h1>🥋 TOP TKD ADMIN PANEL</h1>

    <p>
        Welcome,
        <strong id="adminName">Master Admin</strong>
    </p>

</header>


<div class="admin-grid">

<!-- =========================
     ADD STUDENT
========================= -->

<div class="card">

<h2>➕ Add New Student</h2>

<label>Student Full Name</label>
<input
    type="text"
    id="sName"
    placeholder="Full Name"
>

<label>Date of Birth</label>

<div class="dob-group">

<select id="sDay">
<option value="">Day</option>
</select>

<select id="sMonth">
<option value="">Month</option>
</select>

<select id="sYear">
<option value="">Year</option>
</select>

</div>

<label>Gender</label>

<select id="sGender">
<option value="">Select Gender</option>
<option value="Male">Male</option>
<option value="Female">Female</option>
<option value="Other">Other</option>
<option value="Prefer not to say">
Prefer not to say
</option>
</select>

<label>Student Email</label>

<input
    type="email"
    id="sEmail"
    placeholder="student@email.com"
>

<label>Student Phone</label>

<input
    type="tel"
    id="sPhone"
    placeholder="Phone number"
>


<label>Belt Rank</label>

<select id="sBelt">

<option value="White">White</option>
<option value="Yellow">Yellow</option>
<option value="Green">Green</option>
<option value="Blue">Blue</option>
<option value="red">red</option>
<option value="Black">Black</option>
<option value="Black 1st Dan">Black 1st Dan</option>
<option value="Black 2nd Dan">Black 2nd Dan</option>
<option value="Black 3rd Dan">Black 3rd Dan</option>

</select>


<label>Experience Level</label>

<select id="sExperience">

<option value="">Select Experience</option>
<option value="No Experience">No Experience</option>
<option value="Some Experience">Some Experience</option>
<option value="Experienced">Experienced</option>

</select>


<h3>Parent / Guardian</h3>

<label>Guardian Name</label>

<input
    type="text"
    id="pName"
    placeholder="Parent / Guardian"
>

<label>Guardian Phone</label>

<input
    type="tel"
    id="pPhone"
    placeholder="Guardian phone"
>

<label>Home Address</label>

<textarea
    id="pAddress"
    rows="2"
    placeholder="Home address"
></textarea>

<label>Emergency Contact</label>

<input
    type="tel"
    id="sEmergency"
    placeholder="Emergency contact"
>


<h3>Medical Information</h3>

<textarea
    id="sMedical"
    rows="3"
    placeholder="Medical information, allergies, injuries..."
></textarea>


<h3>Fees</h3>

<div class="checkbox-row">

<input
    type="checkbox"
    id="sRegPaid"
>

<label style="margin:0;">
Registration Fee Paid ($15)
</label>

</div>


<label>Monthly Fee Paid</label>

<input
    type="number"
    id="sFeePaid"
    min="0"
    step="0.01"
    placeholder="0.00"
>


<button
    class="btn-green"
    onclick="addStudent()"
>
💾 Save Student
</button>

</div>


<!-- =========================
     DASHBOARD
========================= -->

<div class="card">

<h2>📊 Club Statistics</h2>

<div class="stats">

<div class="stat">
Total Students
<strong id="totalStudents">0</strong>
</div>

<div class="stat">
Registration
<strong>$<span id="totalReg">0</span></strong>
</div>

<div class="stat">
Monthly Paid
<strong>$<span id="totalCollected">0</span></strong>
</div>

<div class="stat">
Monthly Due
<strong>$<span id="totalDue">0</span></strong>
</div>

</div>

</div>


<!-- =========================
     STUDENTS
========================= -->

<div class="card full">

<h2>📋 All Student Profiles</h2>

<input
    class="search"
    id="searchStudent"
    type="search"
    placeholder="🔎 Search student..."
    oninput="displayStudents()"
>

<div id="studentList">
<div class="loading">
Loading students...
</div>
</div>

</div>

</div>


<!-- =========================
     EDIT MODAL
========================= -->

<div
    class="modal"
    id="editModal"
>

<div class="modal-content">

<h2>✏️ Edit Student</h2>

<div id="editForm"></div>

<button
    class="btn-green"
    onclick="saveEdit()"
>
Save Changes
</button>

<button
    class="close"
    onclick="closeModal()"
>
Cancel
</button>

</div>

</div>


<script>

/* =====================================================
   SUPABASE CONFIGURATION
===================================================== */

const SUPABASE_URL =
"https://ohrzdhpttcxisiwmesxp.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_blBKBN-cs_QuSf2XxGPlAw_bdzgS58_";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let students = [];

let editingId = null;

const REG_FEE = 15;

const months = {
    Jan:"01",
    Feb:"02",
    Mar:"03",
    Apr:"04",
    May:"05",
    Jun:"06",
    Jul:"07",
    Aug:"08",
    Sep:"09",
    Oct:"10",
    Nov:"11",
    Dec:"12"
};


/* =====================================================
   INITIALIZATION
===================================================== */

window.addEventListener("load", async function(){

    createDOBOptions();

    await checkAdmin();

    await loadStudents();

});


/* =====================================================
   CREATE DOB OPTIONS
===================================================== */

function createDOBOptions(){

    const day =
        document.getElementById("sDay");

    const month =
        document.getElementById("sMonth");

    const year =
        document.getElementById("sYear");


    for(let i=1;i<=31;i++){

        day.innerHTML +=
        `<option value="${i}">${i}</option>`;

    }


    Object.keys(months).forEach(m => {

        month.innerHTML +=
        `<option value="${m}">${m}</option>`;

    });


    const currentYear =
        new Date().getFullYear();


    for(
        let i=currentYear;
        i>=1950;
        i--
    ){

        year.innerHTML +=
        `<option value="${i}">${i}</option>`;

    }

}


/* =====================================================
   ADMIN AUTHENTICATION
===================================================== */

async function checkAdmin(){

    const {
        data:{
            user
        }
    } =
    await supabaseClient.auth.getUser();


    if(!user){

        window.location =
        "index.html";

        return;

    }


    const {
        data:profile,
        error
    } =
    await supabaseClient
    .from("profiles")
    .select("full_name,role")
    .eq("id",user.id)
    .single();


    if(error){

        console.error(error);

        showMessage(
            "Unable to verify admin account.",
            "error"
        );

        return;

    }


    if(profile.role !== "admin"){

        alert(
            "Access denied. Admin account required."
        );

        await supabaseClient.auth.signOut();

        window.location =
        "index.html";

        return;

    }


    document.getElementById(
        "adminName"
    ).textContent =
    profile.full_name || "Master Admin";

}


/* =====================================================
   DOB
===================================================== */

function getDOB(){

    const day =
        document.getElementById("sDay").value;

    const month =
        document.getElementById("sMonth").value;

    const year =
        document.getElementById("sYear").value;


    if(!day || !month || !year){

        return null;

    }


    return `${year}-${months[month]}-${String(day).padStart(2,"0")}`;

}


/* =====================================================
   AGE
===================================================== */

function getAge(dob){

    if(!dob){

        return 0;

    }


    const birth =
        new Date(dob);

    const today =
        new Date();


    let age =
        today.getFullYear() -
        birth.getFullYear();


    const month =
        today.getMonth() -
        birth.getMonth();


    if(
        month < 0 ||
        (
            month === 0 &&
            today.getDate() < birth.getDate()
        )
    ){

        age--;

    }


    return age;

}


/* =====================================================
   MONTHLY FEE
===================================================== */

function getMonthlyFee(dob){

    const age =
        getAge(dob);


    return age < 20 ? 20 : 40;

}


/* =====================================================
   ADD STUDENT
===================================================== */

async function addStudent(){

    const name =
        document.getElementById("sName")
        .value
        .trim();


    const dob =
        getDOB();


    if(!name){

        alert(
            "Please enter the student's full name."
        );

        return;

    }


    if(!dob){

        alert(
            "Please select the student's date of birth."
        );

        return;

    }


    const gender =
        document.getElementById("sGender").value
        || null;


    const email =
        document.getElementById("sEmail")
        .value
        .trim()
        || null;


    const phone =
        document.getElementById("sPhone")
        .value
        .trim()
        || null;


    const belt =
        document.getElementById("sBelt").value
        || "White";


    const experience =
        document.getElementById("sExperience").value
        || null;


    const guardian =
        document.getElementById("pName")
        .value
        .trim()
        || null;


    const guardianPhone =
        document.getElementById("pPhone")
        .value
        .trim()
        || null;


    const address =
        document.getElementById("pAddress")
        .value
        .trim()
        || null;


    const emergency =
        document.getElementById("sEmergency")
        .value
        .trim()
        || null;


    const medical =
        document.getElementById("sMedical")
        .value
        .trim()
        || "None";


    const registrationPaid =
        document.getElementById("sRegPaid")
        .checked
        ? 15
        : 0;


    const monthlyPaid =
        parseFloat(
            document.getElementById("sFeePaid").value
        ) || 0;


    const monthlyFee =
        getMonthlyFee(dob);


    const {
        data:{
            user
        }
    } =
    await supabaseClient.auth.getUser();


    if(!user){

        alert(
            "Your admin session has expired. Please log in again."
        );

        window.location =
        "index.html";

        return;

    }


    const studentData = {

        student_name:name,

        date_of_birth:dob,

        gender:gender,

        student_email:email,

        student_phone:phone,

        belt_rank:belt,

        experience_level:experience,

        join_date:
            new Date()
            .toISOString()
            .split("T")[0],

        parent_guardian_name:guardian,

        parent_phone:guardianPhone,

        home_address:address,

        emergency_contact:emergency,

        medical_information:medical,

        registration_fee_paid:
            registrationPaid,

        monthly_fee:
            monthlyFee,

        monthly_fee_paid:
            monthlyPaid,

        registration_fee_paid_at:
            registrationPaid > 0
            ? new Date().toISOString()
            : null,

        last_monthly_payment_at:
            monthlyPaid > 0
            ? new Date().toISOString()
            : null,

        status:"active",

        user_id:null

    };


    const {
        data,
        error
    } =
    await supabaseClient
    .from("students")
    .insert(studentData)
    .select()
    .single();


    if(error){

        console.error(
            "SUPABASE ERROR:",
            error
        );

        showMessage(
            "Supabase error: " +
            error.message,
            "error"
        );

        return;

    }


    showMessage(
        `${name} was added successfully!`,
        "success"
    );


    clearStudentForm();


    await loadStudents();

}


/* =====================================================
   LOAD STUDENTS
===================================================== */

async function loadStudents(){

    document.getElementById(
        "studentList"
    ).innerHTML =
    `<div class="loading">
        Loading students...
     </div>`;


    const {
        data,
        error
    } =
    await supabaseClient
    .from("students")
    .select("*")
    .order(
        "created_at",
        {ascending:false}
    );


    if(error){

        console.error(error);

        showMessage(
            "Could not load students: " +
            error.message,
            "error"
        );

        return;

    }


    students =
        data || [];


    updateStatistics();

    displayStudents();

}


/* =====================================================
   DISPLAY STUDENTS
===================================================== */

function displayStudents(){

    const list =
        document.getElementById(
            "studentList"
        );


    const search =
        document.getElementById(
            "searchStudent"
        )
        .value
        .toLowerCase()
        .trim();


    const filtered =
        students.filter(s => {

            return (
                (s.student_name || "")
                .toLowerCase()
                .includes(search)

                ||

                (s.student_email || "")
                .toLowerCase()
                .includes(search)

                ||

                (s.student_phone || "")
                .toLowerCase()
                .includes(search)
            );

        });


    if(filtered.length === 0){

        list.innerHTML =
        "No students found.";

        return;

    }


    list.innerHTML =
    filtered.map(s => {

        const monthlyFee =
            Number(s.monthly_fee) || 0;


        const paid =
            Number(s.monthly_fee_paid) || 0;


        const due =
            Math.max(
                0,
                monthlyFee - paid
            );


        const registration =
            Number(
                s.registration_fee_paid
            ) || 0;


        const statusClass =
            s.status === "active"
            ? "active"
            : "suspended";


        return `

        <div class="student-row">

            <h3>
                ${escapeHTML(
                    s.student_name || "Unnamed Student"
                )}
            </h3>

            <div class="student-info">

                <b>Belt:</b>
                <span class="badge">
                    ${escapeHTML(
                        s.belt_rank || "White"
                    )}
                </span>

                <br>

                <b>Age:</b>
                ${getAge(s.date_of_birth)}

                <br>

                <b>Gender:</b>
                ${escapeHTML(
                    s.gender || "Not provided"
                )}

                <br>

                <b>Email:</b>
                ${escapeHTML(
                    s.student_email || "Not provided"
                )}

                <br>

                <b>Phone:</b>
                ${escapeHTML(
                    s.student_phone || "Not provided"
                )}

                <br>

                <b>Guardian:</b>
                ${escapeHTML(
                    s.parent_guardian_name ||
                    "Not provided"
                )}

                <br>

                <b>Medical:</b>
                ${escapeHTML(
                    s.medical_information ||
                    "None"
                )}

                <br>

                <b>Registration:</b>
                $${registration.toFixed(2)}

                <br>

                <b>Monthly Fee:</b>
                $${monthlyFee.toFixed(2)}

                <br>

                <b>Monthly Paid:</b>
                $${paid.toFixed(2)}

                <br>

                <b>Monthly Due:</b>
                <span class="fee-due">
                    $${due.toFixed(2)}
                </span>

                <br>

                <b>Status:</b>

                <span class="badge ${statusClass}">
                    ${escapeHTML(
                        s.status || "active"
                    )}
                </span>

            </div>


            <div class="button-row">

                <button
                    class="btn-blue"
                    onclick="openEdit('${s.id}')"
                >
                    ✏️ Edit
                </button>

                <button
                    class="btn-danger"
                    onclick="deleteStudent('${s.id}')"
                >
                    🗑 Delete
                </button>

            </div>

        </div>

        `;

    }).join("");

}


/* =====================================================
   STATISTICS
===================================================== */

function updateStatistics(){

    let reg = 0;

    let collected = 0;

    let due = 0;


    students.forEach(s => {

        reg +=
            Number(
                s.registration_fee_paid
            ) || 0;


        collected +=
            Number(
                s.monthly_fee_paid
            ) || 0;


        due +=
            Math.max(
                0,
                (Number(s.monthly_fee) || 0)
                -
                (Number(s.monthly_fee_paid) || 0)
            );

    });


    document.getElementById(
        "totalStudents"
    ).textContent =
    students.length;


    document.getElementById(
        "totalReg"
    ).textContent =
    reg.toFixed(2);


    document.getElementById(
        "totalCollected"
    ).textContent =
    collected.toFixed(2);


    document.getElementById(
        "totalDue"
    ).textContent =
    due.toFixed(2);

}


/* =====================================================
   EDIT STUDENT
===================================================== */

function openEdit(id){

    const student =
        students.find(
            s => s.id === id
        );


    if(!student){

        return;

    }


    editingId =
        id;


    document.getElementById(
        "editForm"
    ).innerHTML = `

    <label>Student Name</label>

    <input
        id="editName"
        value="${escapeAttribute(
            student.student_name || ""
        )}"
    >


    <label>Email</label>

    <input
        id="editEmail"
        type="email"
        value="${escapeAttribute(
            student.student_email || ""
        )}"
    >


    <label>Phone</label>

    <input
        id="editPhone"
        value="${escapeAttribute(
            student.student_phone || ""
        )}"
    >


    <label>Belt Rank</label>

    <select id="editBelt">

        ${[
            "White",
            "Yellow",
            "Green",
            "Blue",
            "Purple",
            "Brown",
            "Black",
            "Black 1st Dan",
            "Black 2nd Dan",
            "Black 3rd Dan"
        ].map(b => `
            <option
                value="${b}"
                ${student.belt_rank === b
                    ? "selected"
                    : ""}
            >
                ${b}
            </option>
        `).join("")}

    </select>


    <label>Status</label>

    <select id="editStatus">

        ${[
            "active",
            "inactive",
            "suspended",
            "graduated"
        ].map(status => `
            <option
                value="${status}"
                ${student.status === status
                    ? "selected"
                    : ""}
            >
                ${status}
            </option>
        `).join("")}

    </select>


    <label>Monthly Fee</label>

    <input
        id="editMonthlyFee"
        type="number"
        min="0"
        step="0.01"
        value="${Number(
            student.monthly_fee || 0
        )}"
    >


    <label>Monthly Fee Paid</label>

    <input
        id="editMonthlyPaid"
        type="number"
        min="0"
        step="0.01"
        value="${Number(
            student.monthly_fee_paid || 0
        )}"
    >


    <label>Medical Information</label>

    <textarea
        id="editMedical"
        rows="3"
    >${escapeHTML(
        student.medical_information || "None"
    )}</textarea>

    `;


    document.getElementById(
        "editModal"
    ).style.display =
    "flex";

}


/* =====================================================
   SAVE EDIT
===================================================== */

async function saveEdit(){

    const name =
        document.getElementById(
            "editName"
        ).value.trim();


    if(!name){

        alert(
            "Student name is required."
        );

        return;

    }


    const updates = {

        student_name:name,

        student_email:
            document.getElementById(
                "editEmail"
            ).value.trim() || null,

        student_phone:
            document.getElementById(
                "editPhone"
            ).value.trim() || null,

        belt_rank:
            document.getElementById(
                "editBelt"
            ).value,

        status:
            document.getElementById(
                "editStatus"
            ).value,

        monthly_fee:
            parseFloat(
                document.getElementById(
                    "editMonthlyFee"
                ).value
            ) || 0,

        monthly_fee_paid:
            parseFloat(
                document.getElementById(
                    "editMonthlyPaid"
                ).value
            ) || 0,

        medical_information:
            document.getElementById(
                "editMedical"
            ).value.trim() || "None"

    };


    const {
        error
    } =
    await supabaseClient
    .from("students")
    .update(updates)
    .eq("id",editingId);


    if(error){

        console.error(error);

        alert(
            "Update failed: " +
            error.message
        );

        return;

    }


    closeModal();

    showMessage(
        "Student updated successfully.",
        "success"
    );


    await loadStudents();

}


/* =====================================================
   DELETE STUDENT
===================================================== */

async function deleteStudent(id){

    const student =
        students.find(
            s => s.id === id
        );


    if(!student){

        return;

    }


    const confirmDelete =
        confirm(
            `Delete ${student.student_name}?`
        );


    if(!confirmDelete){

        return;

    }


    const {
        error
    } =
    await supabaseClient
    .from("students")
    .delete()
    .eq("id",id);


    if(error){

        console.error(error);

        alert(
            "Delete failed: " +
            error.message
        );

        return;

    }


    showMessage(
        "Student deleted successfully.",
        "success"
    );


    await loadStudents();

}

   LOGOUT
===================================================== */

async function logout(){

    await supabaseClient.auth.signOut();

    window.location =
    "index.html";

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type
){

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;


    message.className =
        "message " + type;


    message.style.display =
        "block";


    setTimeout(() => {

        message.style.display =
            "none";

    },5000);

}


/* =====================================================
   SECURITY / HTML ESCAPING
===================================================== */

function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function escapeAttribute(value){

    return escapeHTML(value);

}
