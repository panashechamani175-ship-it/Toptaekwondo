<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TOP TKD - Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
    --red:#c62828;
    --red-dark:#8e0000;
    --red-light:#ff3030;
    --dark:#080808;
    --dark2:#171717;
    --yellow:#ffeb3b;
    --bg:#f1f1f1;
    --green:#00a651;
    --blue:#1976d2;
    --white:#fff;
    --gray:#666;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:var(--bg);
    font-family:'Segoe UI',Arial,sans-serif;
    color:#222;
}

/* ================= HEADER ================= */

.admin-header{
    background:linear-gradient(
        135deg,
        #050505,
        #171717,
        #8e0000
    );
    color:#fff;
    padding:25px;
    border-radius:14px;
    border-left:6px solid var(--yellow);
    margin-bottom:20px;
    box-shadow:0 8px 25px rgba(0,0,0,.2);
}

.admin-header h1{
    margin:0;
    color:var(--yellow);
}

.admin-header p{
    margin-bottom:0;
}

.logout{
    float:right;
    background:rgba(255,255,255,.15);
    color:#fff;
    border:1px solid #fff;
    padding:9px 18px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    width:auto;
    margin:0;
}

/* ================= GRID ================= */

.admin-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

@media(max-width:900px){
    .admin-grid{
        grid-template-columns:1fr;
    }
}

/* ================= CARDS ================= */

.card{
    background:#fff;
    padding:20px;
    border-radius:14px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    border-top:4px solid var(--red);
}

.full{
    grid-column:1/-1;
}

.card h2,
.card h3{
    color:var(--red);
    margin-top:0;
    border-bottom:2px solid var(--yellow);
    padding-bottom:8px;
}

/* ================= FORMS ================= */

label{
    display:block;
    font-weight:bold;
    margin-top:10px;
    font-size:14px;
}

input,
select,
textarea,
button{
    width:100%;
    padding:11px;
    margin-top:6px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:15px;
}

textarea{
    resize:vertical;
}

button{
    border:none;
    background:var(--red);
    color:#fff;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    opacity:.9;
    transform:translateY(-1px);
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
    transform:none;
}

.btn-blue{
    background:var(--blue);
}

.btn-green{
    background:var(--green);
}

.btn-dark{
    background:var(--dark);
}

.btn-danger{
    background:#9b0000;
}

/* ================= DOB ================= */

.dob-group{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:8px;
}

/* ================= CHECKBOX ================= */

.checkbox-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:12px;
}

.checkbox-row input{
    width:auto;
    margin:0;
}

/* ================= STATISTICS ================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

@media(max-width:700px){
    .stats{
        grid-template-columns:1fr 1fr;
    }
}

.stat{
    padding:15px;
    background:#fafafa;
    border-radius:10px;
    border-left:5px solid var(--red);
}

.stat strong{
    display:block;
    font-size:24px;
    margin-top:5px;
}

/* ================= SEARCH ================= */

.search{
    margin-bottom:15px;
}

/* ================= STUDENTS ================= */

.student-row{
    background:#fafafa;
    border:1px solid #ddd;
    border-radius:12px;
    padding:15px;
    margin-bottom:12px;
}

.student-row h3{
    margin:0 0 8px;
    color:var(--dark);
    border:0;
}

.student-info{
    color:#555;
    font-size:14px;
    line-height:1.7;
}

/* ================= BUTTON ROW ================= */

.button-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:10px;
}

.button-row button{
    width:auto;
    flex:1;
    min-width:100px;
}

/* ================= STATUS ================= */

.badge{
    display:inline-block;
    padding:4px 8px;
    border-radius:20px;
    font-weight:bold;
    font-size:12px;
}

.active{
    background:#d8f5dc;
    color:#176b20;
}

.suspended{
    background:#ffd6d6;
    color:#9b0000;
}

/* ================= BELTS ================= */

.belt-badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:4px 9px;
    border-radius:20px;
    background:#fff;
    border:1px solid #ccc;
    font-weight:800;
    color:#111;
}

.belt-bar{
    display:inline-block;
    width:42px;
    height:11px;
    border-radius:3px;
    border:1px solid #999;
    box-shadow:inset 0 1px 1px rgba(255,255,255,.25);
}

.belt-white{
    background:#fff;
}

.belt-yellow{
    background:#ffeb3b;
}

.belt-green{
    background:#20a020;
}

.belt-blue{
    background:#1674d1;
}

.belt-red{
    background:#d00000;
}

.belt-black{
    background:#111;
    border-color:#555;
}

/* ================= MESSAGE ================= */

.message{
    padding:12px;
    border-radius:8px;
    margin-bottom:12px;
    display:none;
}

.success{
    background:#dff5e2;
    color:#176b20;
}

.error{
    background:#ffdede;
    color:#a00000;
}

/* ================= MODAL ================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.6);
    z-index:1000;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-content{
    background:#fff;
    width:100%;
    max-width:600px;
    max-height:90vh;
    overflow-y:auto;
    border-radius:14px;
    padding:20px;
}

.close{
    background:#555;
}

/* ================= LOADING ================= */

.loading{
    text-align:center;
    padding:20px;
    color:#666;
}
</style>
</head>

<body>

<div id="message" class="message"></div>

<!-- ================= HEADER ================= -->

>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://ohrzdhpttcxisiwmesxp.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_blBKBN-cs_QuSf2XxGPlAw_bdzgS58_";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =====================================================
   GLOBALS
===================================================== */

let students = [];

let editingId = null;

const REG_FEE = 15;

const months = {
    Jan:"01",
    Feb:"02",
    Mar:"03",
    Apr:"04",
    May:"05",
    Jun:"06",
    Jul:"07",
    Aug:"08",
    Sep:"09",
    Oct:"10",
    Nov:"11",
    Dec:"12"
};


/* =====================================================
   ELEMENT HELPER
===================================================== */

function $(id){
    return document.getElementById(id);
}


/* =====================================================
   START
===================================================== */

window.addEventListener("DOMContentLoaded", async () => {

    createDOBOptions();

    const isAdmin =
        await checkAdmin();

    if(!isAdmin){
        return;
    }

    await loadStudents();

    $("saveStudentBtn")
        .addEventListener(
            "click",
            addStudent
        );

    $("saveEditBtn")
        .addEventListener(
            "click",
            saveEdit
        );

    $("closeModalBtn")
        .addEventListener(
            "click",
            closeModal
        );

    $("logoutBtn")
        .addEventListener(
            "click",
            logout
        );

    $("searchStudent")
        .addEventListener(
            "input",
            displayStudents
        );

});


/* =====================================================
   DOB OPTIONS
===================================================== */

function createDOBOptions(){

    const day =
        $("sDay");

    const month =
        $("sMonth");

    const year =
        $("sYear");


    for(let i = 1; i <= 31; i++){

        day.insertAdjacentHTML(
            "beforeend",
            `<option value="${i}">
                ${i}
            </option>`
        );

    }


    Object.keys(months)
        .forEach(m => {

            month.insertAdjacentHTML(
                "beforeend",
                `<option value="${m}">
                    ${m}
                </option>`
            );

        });


    const currentYear =
        new Date().getFullYear();


    for(
        let i = currentYear;
        i >= 1950;
        i--
    ){

        year.insertAdjacentHTML(
            "beforeend",
            `<option value="${i}">
                ${i}
            </option>`
        );

    }

}


/* =====================================================
   GET DOB
===================================================== */

function getDOB(){

    const day =
        $("sDay").value;

    const month =
        $("sMonth").value;

    const year =
        $("sYear").value;


    if(!day || !month || !year){

        return null;

    }


    return (
        `${year}-${months[month]}-${String(day).padStart(2,"0")}`
    );

}


/* =====================================================
   AGE
===================================================== */

function getAge(dob){

    if(!dob){
        return 0;
    }


    const birth =
        new Date(dob);

    const today =
        new Date();


    let age =
        today.getFullYear() -
        birth.getFullYear();


    const monthDifference =
        today.getMonth() -
        birth.getMonth();


    if(
        monthDifference < 0 ||
        (
            monthDifference === 0 &&
            today.getDate() < birth.getDate()
        )
    ){

        age--;

    }


    return age;

}


/* =====================================================
   MONTHLY FEE
===================================================== */

function getMonthlyFee(dob){

    return getAge(dob) < 20
        ? 20
        : 40;

}


/* =====================================================
   ADMIN AUTHENTICATION
===================================================== */

async function checkAdmin(){

    try{

        const {
            data:{
                user
            },
            error:userError
        } =
        await supabaseClient
            .auth
            .getUser();


        if(userError || !user){

            window.location.href =
                "index.html";

            return false;

        }


        const {
            data:profile,
            error:profileError
        } =
        await supabaseClient
            .from("profiles")
            .select("full_name,role")
            .eq("id",user.id)
            .single();


        if(profileError){

            console.error(
                "Profile error:",
                profileError
            );

            showMessage(
                "Unable to verify your admin account.",
                "error"
            );

            return false;

        }


        if(!profile || profile.role !== "admin"){

            alert(
                "Access denied. Admin account required."
            );

            await supabaseClient
                .auth
                .signOut();

            window.location.href =
                "index.html";

            return false;

        }


        $("adminName").textContent =
            profile.full_name ||
            "Master Admin";


        return true;

    }
    catch(error){

        console.error(error);

        showMessage(
            "Authentication error. Please log in again.",
            "error"
        );

        return false;

    }

}


/* =====================================================
   ADD STUDENT
===================================================== */

async function addStudent(){

    const button =
        $("saveStudentBtn");


    const name =
        $("sName")
        .value
        .trim();


    const dob =
        getDOB();


    if(!name){

        alert(
            "Please enter the student's full name."
        );

        return;

    }


    if(!dob){

        alert(
            "Please select the student's date of birth."
        );

        return;

    }


    button.disabled = true;

    button.textContent =
        "Saving...";


    try{

        const {
            data:{
                user
            }
        } =
        await supabaseClient
            .auth
            .getUser();


        if(!user){

            alert(
                "Your admin session has expired. Please log in again."
            );

            window.location.href =
                "index.html";

            return;

        }


        const registrationPaid =
            $("sRegPaid").checked
                ? REG_FEE
                : 0;


        const monthlyPaid =
            parseFloat(
                $("sFeePaid").value
            ) || 0;


        const studentData = {

            student_name:name,

            date_of_birth:dob,

            gender:
                $("sGender").value ||
                null,

            student_email:
                $("sEmail").value.trim() ||
                null,

            student_phone:
                $("sPhone").value.trim() ||
                null,

            belt_rank:
                $("sBelt").value ||
                "White",

            experience_level:
                $("sExperience").value ||
                null,

            join_date:
                new Date()
                    .toISOString()
                    .split("T")[0],

            parent_guardian_name:
                $("pName").value.trim() ||
                null,

            parent_phone:
                $("pPhone").value.trim() ||
                null,

            home_address:
                $("pAddress").value.trim() ||
                null,

            emergency_contact:
                $("sEmergency").value.trim() ||
                null,

            medical_information:
                $("sMedical").value.trim() ||
                "None",

            registration_fee_paid:
                registrationPaid,

            monthly_fee:
                getMonthlyFee(dob),

            monthly_fee_paid:
                monthlyPaid,

            registration_fee_paid_at:
                registrationPaid > 0
                    ? new Date().toISOString()
                    : null,

            last_monthly_payment_at:
                monthlyPaid > 0
                    ? new Date().toISOString()
                    : null,

            status:
                "active",

            user_id:
                null

        };


        const {
            error
        } =
        await supabaseClient
            .from("students")
            .insert(studentData);


        if(error){

            console.error(
                "Supabase insert error:",
                error
            );

            showMessage(
                "Supabase error: " +
                error.message,
                "error"
            );

            return;

        }


        showMessage(
            `${name} was added successfully!`,
            "success"
        );


        clearStudentForm();

        await loadStudents();

    }
    finally{

        button.disabled = false;

        button.textContent =
            "💾 Save Student";

    }

}


/* =====================================================
   LOAD STUDENTS
===================================================== */

async function loadStudents(){

    $("studentList").innerHTML =
        `<div class="loading">
            Loading students...
        </div>`;


    const {
        data,
        error
    } =
    await supabaseClient
        .from("students")
        .select("*")
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(
            "Load students error:",
            error
        );

        showMessage(
            "Could not load students: " +
            error.message,
            "error"
        );

        $("studentList").innerHTML =
            `<div class="loading">
                Could not load students.
            </div>`;

        return;

    }


    students =
        data || [];


    updateStatistics();

    displayStudents();

}


/* =====================================================
   BELT CLASS
===================================================== */

function getBeltClass(belt){

    const value =
        String(
            belt || "White"
        ).toLowerCase();


    if(value.includes("yellow")){
        return "yellow";
    }

    if(value.includes("green")){
        return "green";
    }

    if(value.includes("blue")){
        return "blue";
    }

    if(value.includes("red")){
        return "red";
    }

    if(value.includes("black")){
        return "black";
    }

    return "white";

}


/* =====================================================
   BELT HTML
===================================================== */

function beltHTML(belt){

    const label =
        belt || "White";


    return `
        <span class="belt-badge">

            <span
                class="belt-bar belt-${getBeltClass(label)}"
            ></span>

            ${escapeHTML(label)}

        </span>
    `;

}


/* =====================================================
   DISPLAY STUDENTS
===================================================== */

function displayStudents(){

    const list =
        $("studentList");


    const search =
        $("searchStudent")
            .value
            .toLowerCase()
            .trim();


    const filtered =
        students.filter(student => {

            return (

                (student.student_name || "")
                    .toLowerCase()
                    .includes(search)

                ||

                (student.student_email || "")
                    .toLowerCase()
                    .includes(search)

                ||

                (student.student_phone || "")
                    .toLowerCase()
                    .includes(search)

            );

        });


    if(filtered.length === 0){

        list.innerHTML =
            "No students found.";

        return;

    }


    list.innerHTML =
        filtered
            .map(student => {

                const monthlyFee =
                    Number(
                        student.monthly_fee
                    ) || 0;


                const paid =
                    Number(
                        student.monthly_fee_paid
                    ) || 0;


                const due =
                    Math.max(
                        0,
                        monthlyFee - paid
                    );


                const registration =
                    Number(
                        student.registration_fee_paid
                    ) || 0;


                const statusClass =
                    student.status === "active"
                        ? "active"
                        : "suspended";


                return `

                <div class="student-row">

                    <h3>
                        ${escapeHTML(
                            student.student_name ||
                            "Unnamed Student"
                        )}
                    </h3>

                    <div class="student-info">

                        <b>Belt:</b>
                        ${beltHTML(
                            student.belt_rank
                        )}

                        <br>

                        <b>Age:</b>
                        ${getAge(
                            student.date_of_birth
                        )}

                        <br>

                        <b>Gender:</b>
                        ${escapeHTML(
                            student.gender ||
                            "Not provided"
                        )}

                        <br>

                        <b>Email:</b>
                        ${escapeHTML(
                            student.student_email ||
                            "Not provided"
                        )}

                        <br>

                        <b>Phone:</b>
                        ${escapeHTML(
                            student.student_phone ||
                            "Not provided"
                        )}

                        <br>

                        <b>Guardian:</b>
                        ${escapeHTML(
                            student.parent_guardian_name ||
                            "Not provided"
                        )}

                        <br>

                        <b>Medical:</b>
                        ${escapeHTML(
                            student.medical_information ||
                            "None"
                        )}

                        <br>

                        <b>Registration:</b>
                        $${registration.toFixed(2)}

                        <br>

                        <b>Monthly Fee:</b>
                        $${monthlyFee.toFixed(2)}

                        <br>

                        <b>Monthly Paid:</b>
                        $${paid.toFixed(2)}

                        <br>

                        <b>Monthly Due:</b>
                        $${due.toFixed(2)}

                        <br>

                        <b>Status:</b>

                        <span class="badge ${statusClass}">
                            ${escapeHTML(
                                student.status ||
                                "active"
                            )}
                        </span>

                    </div>

                    <div class="button-row">

                        <button
                            class="btn-blue"
                            type="button"
                            onclick="openEdit('${student.id}')"
                        >
                            ✏️ Edit
                        </button>

                        <button
                            class="btn-danger"
                            type="button"
                            onclick="deleteStudent('${student.id}')"
                        >
                            🗑 Delete
                        </button>

                    </div>

                </div>

                `;

            })
            .join("");

}


/* =====================================================
   STATISTICS
===================================================== */

function updateStatistics(){

    let registrationTotal = 0;

    let collectedTotal = 0;

    let dueTotal = 0;


    students.forEach(student => {

        registrationTotal +=
            Number(
                student.registration_fee_paid
            ) || 0;


        collectedTotal +=
            Number(
                student.monthly_fee_paid
            ) || 0;


        dueTotal +=
            Math.max(
                0,
                (
                    Number(
                        student.monthly_fee
                    ) || 0
                )
                -
                (
                    Number(
                        student.monthly_fee_paid
                    ) || 0
                )
            );

    });


    $("totalStudents")
        .textContent =
        students.length;


    $("totalReg")
        .textContent =
        registrationTotal.toFixed(2);


    $("totalCollected")
        .textContent =
        collectedTotal.toFixed(2);


    $("totalDue")
        .textContent =
        dueTotal.toFixed(2);

}


/* =====================================================
   EDIT STUDENT
===================================================== */

function openEdit(id){

    const student =
        students.find(
            item => item.id === id
        );


    if(!student){
        return;
    }


    editingId =
        id;


    const belts = [
        "White",
        "Yellow",
        "Green",
        "Blue",
        "Red",
        "Black",
        "Black 1st Dan",
        "Black 2nd Dan",
        "Black 3rd Dan"
    ];


    const statuses = [
        "active",
        "inactive",
        "suspended",
        "graduated"
    ];


    $("editForm").innerHTML = `

        <label>Student Name</label>

        <input
            id="editName"
            value="${escapeAttribute(
                student.student_name || ""
            )}"
        >


        <label>Email</label>

        <input
            id="editEmail"
            type="email"
            value="${escapeAttribute(
                student.student_email || ""
            )}"
        >


        <label>Phone</label>

        <input
            id="editPhone"
            type="tel"
            value="${escapeAttribute(
                student.student_phone || ""
            )}"
        >


        <label>Belt Rank</label>

        <select id="editBelt">

            ${belts.map(belt => `

                <option
                    value="${belt}"
                    ${
                        student.belt_rank === belt
                            ? "selected"
                            : ""
                    }
                >
                    ${belt}
                </option>

            `).join("")}

        </select>


        <label>Status</label>

        <select id="editStatus">

            ${statuses.map(status => `

                <option
                    value="${status}"
                    ${
                        student.status === status
                            ? "selected"
                            : ""
                    }
                >
                    ${status}
                </option>

            `).join("")}

        </select>


        <label>Monthly Fee</label>

        <input
            id="editMonthlyFee"
            type="number"
            min="0"
            step="0.01"
            value="${Number(
                student.monthly_fee || 0
            )}"
        >


        <label>Monthly Fee Paid</label>

        <input
            id="editMonthlyPaid"
            type="number"
            min="0"
            step="0.01"
            value="${Number(
                student.monthly_fee_paid || 0
            )}"
        >


        <label>Medical Information</label>

        <textarea
            id="editMedical"
            rows="3"
        >${escapeHTML(
            student.medical_information ||
            "None"
        )}</textarea>

    `;


    $("editModal")
        .style.display =
        "flex";

}


/* =====================================================
   SAVE EDIT
===================================================== */

async function saveEdit(){

    if(!editingId){
        return;
    }


    const name =
        $("editName")
            .value
            .trim();


    if(!name){

        alert(
            "Student name is required."
        );

        return;

    }


    const updates = {

        student_name:
            name,

        student_email:
            $("editEmail")
                .value
                .trim() ||
            null,

        student_phone:
            $("editPhone")
                .value
                .trim() ||
            null,

        belt_rank:
            $("editBelt")
                .value,

        status:
            $("editStatus")
                .value,

        monthly_fee:
            parseFloat(
                $("editMonthlyFee")
                    .value
            ) || 0,

        monthly_fee_paid:
            parseFloat(
                $("editMonthlyPaid")
                    .value
            ) || 0,

        medical_information:
            $("editMedical")
                .value
                .trim() ||
            "None"

    };


    const {
        error
    } =
    await supabaseClient
        .from("students")
        .update(updates)
        .eq("id",editingId);


    if(error){

        console.error(error);

        alert(
            "Update failed: " +
            error.message
        );

        return;

    }


    closeModal();

    showMessage(
        "Student updated successfully.",
        "success"
    );


    await loadStudents();

}


/* =====================================================
   DELETE STUDENT
===================================================== */

async function deleteStudent(id){

    const student =
        students.find(
            item => item.id === id
        );


    if(!student){
        return;
    }


    const confirmed =
        confirm(
            `Delete ${student.student_name}?`
        );


    if(!confirmed){
        return;
    }


    const {
        error
    } =
    await supabaseClient
        .from("students")
        .delete()
        .eq("id",id);


    if(error){

        console.error(error);

        alert(
            "Delete failed: " +
            error.message
        );

        return;

    }


    showMessage(
        "Student deleted successfully.",
        "success"
    );


    await loadStudents();

}


/* =====================================================
   CLEAR FORM
===================================================== */

function clearStudentForm(){

    [
        "sName",
        "sEmail",
        "sPhone",
        "pName",
        "pPhone",
        "pAddress",
        "sEmergency",
        "sMedical",
        "sFeePaid"
    ].forEach(id => {

        $(id).value = "";

    });


    $("sDay").value = "";

    $("sMonth").value = "";

    $("sYear").value = "";

    $("sGender").value = "";

    $("sBelt").value = "White";

    $("sExperience").value = "";

    $("sRegPaid").checked = false;

}


/* =====================================================
   CLOSE MODAL
===================================================== */

function closeModal(){

    $("editModal")
        .style.display =
        "none";

    editingId = null;

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

    await supabaseClient
        .auth
        .signOut();

    window.location.href =
        "index.html";

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type
){

    const message =
        $("message");


    message.textContent =
        text;


    message.className =
        "message " + type;


    message.style.display =
        "block";


    setTimeout(() => {

        message.style.display =
            "none";

    },5000);

}


/* =====================================================
   SECURITY ESCAPING
===================================================== */

function escapeHTML(value){

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


function escapeAttribute(value){

    return escapeHTML(value);

}


/* =====================================================
   CLOSE MODAL WHEN CLICKING OUTSIDE
===================================================== */

$("editModal")
    .addEventListener(
        "click",
        event => {

            if(
                event.target ===
                $("editModal")
            ){

                closeModal();

            }

        }
    );

</script>
