<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOP TKD - Admin Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--red:#c62828;--red-dark:#8e0000;--red-light:#ff3030;--dark:#080808;--dark2:#171717;--yellow:#ffeb3b;--bg:#f1f1f1;--green:#00a651;--blue:#1976d2;--white:#fff;--gray:#666}
*{box-sizing:border-box}body{margin:0;padding:20px;background:var(--bg);font-family:'Segoe UI',Arial,sans-serif;color:#222}
.admin-header{background:linear-gradient(135deg,#050505,#171717,#8e0000);color:#fff;padding:25px;border-radius:14px;border-left:6px solid var(--yellow);margin-bottom:20px;box-shadow:0 8px 25px rgba(0,0,0,.2)}
.admin-header h1{margin:0;color:var(--yellow)}.admin-header p{margin-bottom:0}.logout{float:right;background:rgba(255,255,255,.15);color:#fff;border:1px solid #fff;padding:9px 18px;border-radius:8px;cursor:pointer;font-weight:bold;width:auto;margin:0}
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:900px){.admin-grid{grid-template-columns:1fr}}
.card{background:#fff;padding:20px;border-radius:14px;box-shadow:0 3px 12px rgba(0,0,0,.08);border-top:4px solid var(--red)}.full{grid-column:1/-1}
.card h2,.card h3{color:var(--red);margin-top:0;border-bottom:2px solid var(--yellow);padding-bottom:8px}
label{display:block;font-weight:bold;margin-top:10px;font-size:14px}input,select,textarea,button{width:100%;padding:11px;margin-top:6px;border-radius:8px;border:1px solid #ccc;font-size:15px}textarea{resize:vertical}
button{border:none;background:var(--red);color:#fff;font-weight:bold;cursor:pointer;transition:.2s}button:hover{opacity:.9;transform:translateY(-1px)}
.btn-blue{background:var(--blue)}.btn-green{background:var(--green)}.btn-dark{background:var(--dark)}.btn-danger{background:#9b0000}
.dob-group{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.checkbox-row{display:flex;align-items:center;gap:8px;margin-top:12px}.checkbox-row input{width:auto}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}}
.stat{padding:15px;background:#fafafa;border-radius:10px;border-left:5px solid var(--red)}.stat strong{display:block;font-size:24px;margin-top:5px}
.search{margin-bottom:15px}.student-row{background:#fafafa;border:1px solid #ddd;border-radius:12px;padding:15px;margin-bottom:12px}.student-row h3{margin:0 0 8px;color:var(--dark);border:0}
.student-info{color:#555;font-size:14px;line-height:1.7}
.button-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.button-row button{width:auto;flex:1;min-width:100px}
.message{padding:12px;border-radius:8px;margin-bottom:12px;display:none}.success{background:#dff5e2;color:#176b20}.error{background:#ffdede;color:#a00000}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;align-items:center;justify-content:center;padding:20px}.modal-content{background:#fff;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;border-radius:14px;padding:20px}.close{background:#555}
.loading{text-align:center;padding:20px;color:#666}

/* BELT DISPLAY — SAME COLORS AS INDEX */
.belt-badge{display:inline-flex;align-items:center;gap:8px;padding:4px 9px;border-radius:20px;background:#fff;border:1px solid #ccc;font-weight:800;color:#111}
.belt-bar{display:inline-block;width:42px;height:11px;border-radius:3px;border:1px solid #999;box-shadow:inset 0 1px 1px rgba(255,255,255,.25)}
.belt-white{background:#fff}.belt-yellow{background:#ffeb3b}.belt-green{background:#20a020}.belt-blue{background:#1674d1}.belt-red{background:#d00000}.belt-black{background:#111;border-color:#555}

/* =========================================================
   TOP TKD PRO THEME — VISUAL UPGRADE ONLY
   ========================================================= */
body{background:radial-gradient(circle at top right,rgba(198,40,40,.12),transparent 30%),linear-gradient(135deg,#080808 0%,#111 48%,#1b1b1b 100%);color:#eee;min-height:100vh}
.admin-header{position:relative;overflow:hidden;background:linear-gradient(135deg,#050505 0%,#111 48%,#8e0000 100%);border:1px solid rgba(255,255,255,.08);border-left:6px solid var(--red-light);padding:28px 30px;box-shadow:0 14px 40px rgba(0,0,0,.45)}
.admin-header:after{content:'TOP TKD • STUDENT MANAGEMENT';position:absolute;right:28px;bottom:16px;font-size:10px;letter-spacing:2px;color:rgba(255,255,255,.38);font-weight:800}
.admin-header h1{font-size:clamp(24px,4vw,36px);letter-spacing:.5px;text-shadow:0 2px 12px rgba(198,40,40,.45)}
.admin-header p{color:#cfcfcf}.admin-header strong{color:#fff}
.logout{background:#090909;border-color:#d33;box-shadow:0 0 0 1px rgba(255,48,48,.2),0 6px 18px rgba(0,0,0,.35)}
.card{background:linear-gradient(145deg,#fff 0%,#f8f8f8 100%);border-top:4px solid var(--red-light);box-shadow:0 10px 28px rgba(0,0,0,.28);transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(0,0,0,.34)}
.card h2,.card h3{letter-spacing:.2px}
.stats .stat{background:linear-gradient(145deg,#fff,#f4f4f4);box-shadow:inset 0 0 0 1px #e8e8e8,0 4px 12px rgba(0,0,0,.06);border-left:5px solid var(--red-light)}
.stat strong{font-size:28px}
.student-row{background:linear-gradient(145deg,#fff,#f6f6f6);border:1px solid #ddd;box-shadow:0 6px 18px rgba(0,0,0,.07);transition:transform .18s,box-shadow .18s}
.student-row:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.13)}
.student-row h3{font-size:20px}
input,select,textarea{background:#fff;transition:border-color .18s,box-shadow .18s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--red-light);box-shadow:0 0 0 3px rgba(255,48,48,.12)}
.button-row button{box-shadow:0 5px 12px rgba(0,0,0,.12)}
.btn-dark{background:#090909;border:1px solid #c62828;box-shadow:0 0 12px rgba(198,40,40,.18)!important}
.btn-dark:hover{background:#151515;box-shadow:0 0 18px rgba(255,48,48,.35)!important}
.modal-content{box-shadow:0 20px 60px rgba(0,0,0,.5)}
.search{border:2px solid #ddd;font-weight:600}
@media(max-width:700px){body{padding:12px}.admin-header{padding:22px 18px}.admin-header:after{display:none}.logout{padding:8px 12px}.button-row button{min-width:90px}}
</style>
</head>
<body>
<div id="message" class="message"></div>
<header class="admin-header"><button class="logout" onclick="logout()">Logout</button><h1>🥋 TOP TKD ADMIN PANEL</h1><p>Welcome, <strong id="adminName">Master Admin</strong></p></header>

<div class="admin-grid">
<div class="card">
<h2>➕ Add New Student</h2>
<label>Student Full Name</label><input id="sName" type="text" placeholder="Full Name">
<label>Date of Birth</label><div class="dob-group"><select id="sDay"><option value="">Day</option></select><select id="sMonth"><option value="">Month</option></select><select id="sYear"><option value="">Year</option></select></div>
<label>Gender</label><select id="sGender"><option value="">Select Gender</option><option>Male</option><option>Female</option><option>Other</option><option>Prefer not to say</option></select>
<label>Student Email</label><input id="sEmail" type="email" placeholder="student@email.com">
<label>Student Phone</label><input id="sPhone" type="tel" placeholder="Phone number">
<label>Belt Rank</label>
<select id="sBelt"><option value="White">White</option><option value="Yellow">Yellow</option><option value="Green">Green</option><option value="Blue">Blue</option><option value="Red">Red</option><option value="Black">Black</option><option value="Black 1st Dan">Black 1st Dan</option><option value="Black 2nd Dan">Black 2nd Dan</option><option value="Black 3rd Dan">Black 3rd Dan</option></select>
<label>Experience Level</label><select id="sExperience"><option value="">Select Experience</option><option>No Experience</option><option>Some Experience</option><option>Experienced</option></select>
<h3>Parent / Guardian</h3><label>Guardian Name</label><input id="pName" type="text" placeholder="Parent / Guardian">
<label>Guardian Phone</label><input id="pPhone" type="tel" placeholder="Guardian phone"><label>Home Address</label><textarea id="pAddress" rows="2" placeholder="Home address"></textarea><label>Emergency Contact</label><input id="sEmergency" type="tel" placeholder="Emergency contact">
<h3>Medical Information</h3><textarea id="sMedical" rows="3" placeholder="Medical information, allergies, injuries..."></textarea>
<h3>Fees</h3><div class="checkbox-row"><input type="checkbox" id="sRegPaid"><label style="margin:0">Registration Fee Paid ($15)</label></div>
<label>Monthly Fee Paid</label><input id="sFeePaid" type="number" min="0" step="0.01" placeholder="0.00">
<button class="btn-green" onclick="addStudent()">💾 Save Student</button>
</div>

<div class="card"><h2>📊 Club Statistics</h2><div class="stats"><div class="stat">Total Students<strong id="totalStudents">0</strong></div><div class="stat">Registration<strong>$<span id="totalReg">0</span></strong></div><div class="stat">Monthly Paid<strong>$<span id="totalCollected">0</span></strong></div><div class="stat">Monthly Due<strong>$<span id="totalDue">0</span></strong></div></div></div>

<div class="card full"><h2>📋 All Student Profiles</h2><input class="search" id="searchStudent" type="search" placeholder="🔎 Search student..." oninput="displayStudents()"><div id="studentList"><div class="loading">Loading students...</div></div></div>
</div>

<div class="modal" id="editModal"><div class="modal-content"><h2>✏️ Edit Student</h2><div id="editForm"></div><button class="btn-green" onclick="saveEdit()">Save Changes</button><button class="close" onclick="closeModal()">Cancel</button></div></div>

<script>
const SUPABASE_URL="https://ohrzdhpttcxisiwmesxp.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_blBKBN-cs_QuSf2XxGPlAw_bdzgS58_";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let students=[],editingId=null;
const REG_FEE=15;
const months={Jan:"01",Feb:"02",Mar:"03",Apr:"04",May:"05",Jun:"06",Jul:"07",Aug:"08",Sep:"09",Oct:"10",Nov:"11",Dec:"12"};

window.addEventListener("load",async()=>{createDOBOptions();await checkAdmin();await loadStudents()});

function createDOBOptions(){
 const d=document.getElementById("sDay"),m=document.getElementById("sMonth"),y=document.getElementById("sYear");
 for(let i=1;i<=31;i++)d.innerHTML+=`<option value="${i}">${i}</option>`;
 Object.keys(months).forEach(x=>m.innerHTML+=`<option value="${x}">${x}</option>`);
 for(let i=new Date().getFullYear();i>=1950;i--)y.innerHTML+=`<option value="${i}">${i}</option>`;
}
function getDOB(){
 const d=sDay.value,m=sMonth.value,y=sYear.value;
 return d&&m&&y?`${y}-${months[m]}-${String(d).padStart(2,"0")}`:null;
}
function getAge(dob){
 if(!dob)return 0;const b=new Date(dob),t=new Date();let a=t.getFullYear()-b.getFullYear();const m=t.getMonth()-b.getMonth();if(m<0||(m===0&&t.getDate()<b.getDate()))a--;return a;
}
function getMonthlyFee(dob){return getAge(dob)<20?20:40}
function getStudentId(s){return s.student_id||("TKD-"+String(s.id||"").replaceAll("-","").slice(-8).toUpperCase())}

async function checkAdmin(){
 const {data:{user}}=await supabaseClient.auth.getUser();
 if(!user){location.href="index.html";return}
 const {data:profile,error}=await supabaseClient.from("profiles").select("full_name,role").eq("id",user.id).single();
 if(error){showMessage("Unable to verify admin account.","error");return}
 if(profile.role!=="admin"){alert("Access denied. Admin account required.");await supabaseClient.auth.signOut();location.href="index.html";return}
 document.getElementById("adminName").textContent=profile.full_name||"Master Admin";
}

async function addStudent(){
 const name=document.getElementById("sName").value.trim(),dob=getDOB();
 if(!name||!dob){alert("Please enter the student's name and date of birth.");return}
 const registrationPaid=document.getElementById("sRegPaid").checked;
 const monthlyPaid=parseFloat(document.getElementById("sFeePaid").value)||0;
 const {data:{user}}=await supabaseClient.auth.getUser();
 if(!user){alert("Your admin session has expired.");location.href="index.html";return}
 const studentData={
  student_name:name,date_of_birth:dob,
  gender:document.getElementById("sGender").value||null,
  student_email:document.getElementById("sEmail").value.trim()||null,
  student_phone:document.getElementById("sPhone").value.trim()||null,
  belt_rank:document.getElementById("sBelt").value||"White",
  experience_level:document.getElementById("sExperience").value||null,
  join_date:new Date().toISOString().split("T")[0],
  parent_guardian_name:document.getElementById("pName").value.trim()||null,
  parent_phone:document.getElementById("pPhone").value.trim()||null,
  home_address:document.getElementById("pAddress").value.trim()||null,
  emergency_contact:document.getElementById("sEmergency").value.trim()||null,
  medical_information:document.getElementById("sMedical").value.trim()||"None",
  registration_fee_paid:registrationPaid,monthly_fee:getMonthlyFee(dob),monthly_fee_paid:monthlyPaid,
  registration_fee_paid_at:registrationPaid?new Date().toISOString():null,
  last_monthly_payment_at:monthlyPaid?new Date().toISOString():null,status:"active",user_id:null
 };
 const {error}=await supabaseClient.from("students").insert(studentData);
 if(error){showMessage("Supabase error: "+error.message,"error");return}
 showMessage(`${name} was added successfully!`,"success");clearStudentForm();await loadStudents();
}

async function loadStudents(){
 document.getElementById("studentList").innerHTML='<div class="loading">Loading students...</div>';
 const {data,error}=await supabaseClient.from("students").select("*").order("created_at",{ascending:false});
 if(error){showMessage("Could not load students: "+error.message,"error");return}
 students=data||[];updateStatistics();displayStudents();
}

function getBeltClass(belt){
 const v=String(belt||"White").toLowerCase();
 if(v.includes("yellow"))return"yellow";if(v.includes("green"))return"green";if(v.includes("blue"))return"blue";if(v.includes("red"))return"red";if(v.includes("black"))return"black";return"white";
}
function beltHTML(belt){
 const label=belt||"White";
 return `<span class="belt-badge"><span class="belt-bar belt-${getBeltClass(label)}"></span>${escapeHTML(label)}</span>`;
}

function displayStudents(){
 const list=document.getElementById("studentList"),search=document.getElementById("searchStudent").value.toLowerCase().trim();
 const filtered=students.filter(s=>getStudentId(s).toLowerCase().includes(search)||(s.student_name||"").toLowerCase().includes(search)||(s.student_email||"").toLowerCase().includes(search)||(s.student_phone||"").toLowerCase().includes(search));
 if(!filtered.length){list.innerHTML="No students found.";return}
 list.innerHTML=filtered.map(s=>{
  const fee=Number(s.monthly_fee)||0,paid=Number(s.monthly_fee_paid)||0,due=Math.max(0,fee-paid),reg=s.registration_fee_paid===true?15:0;
  const statusClass=s.status==="active"?"active":"suspended";
  return `<div class="student-row"><h3>${escapeHTML(s.student_name||"Unnamed Student")}</h3><div class="student-info">
  <b>Student ID:</b> ${escapeHTML(getStudentId(s))}<br>
  <b>Belt:</b> ${beltHTML(s.belt_rank)}<br>
  <b>Age:</b> ${getAge(s.date_of_birth)}<br><b>Gender:</b> ${escapeHTML(s.gender||"Not provided")}<br>
  <b>Email:</b> ${escapeHTML(s.student_email||"Not provided")}<br><b>Phone:</b> ${escapeHTML(s.student_phone||"Not provided")}<br>
  <b>Guardian:</b> ${escapeHTML(s.parent_guardian_name||"Not provided")}<br><b>Medical:</b> ${escapeHTML(s.medical_information||"None")}<br>
  <b>Registration:</b> $${reg.toFixed(2)}<br><b>Monthly Fee:</b> $${fee.toFixed(2)}<br><b>Monthly Paid:</b> $${paid.toFixed(2)}<br>
  <b>Monthly Due:</b> $${due.toFixed(2)}<br><b>Status:</b> <span class="badge ${statusClass}">${escapeHTML(s.status||"active")}</span>
  </div><div class="button-row"><button class="btn-blue" onclick="openEdit('${s.id}')">✏️ Edit</button><button class="btn-dark" onclick="openStudentID('${s.id}')">🪪 Student ID</button><button class="btn-green" onclick="viewStudentID('${s.id}')">🪪 View Student ID</button><button class="btn-danger" onclick="deleteStudent('${s.id}')">🗑 Delete</button></div></div>`;
 }).join("");
}
function viewStudentID(id){
  if(!id)return;
  window.location.href = `student-id.html?id=${encodeURIComponent(id)}`;
}

function openStudentID(id){
  if(!id)return;
  window.location.href="student-id.html?id="+encodeURIComponent(id);
}
function updateStatistics(){
 let reg=0,collected=0,due=0;students.forEach(s=>{reg+=s.registration_fee_paid===true?15:0;collected+=Number(s.monthly_fee_paid)||0;due+=Math.max(0,(Number(s.monthly_fee)||0)-(Number(s.monthly_fee_paid)||0))});
 totalStudents.textContent=students.length;totalReg.textContent=reg.toFixed(2);totalCollected.textContent=collected.toFixed(2);totalDue.textContent=due.toFixed(2);
}
function openEdit(id){
 const s=students.find(x=>x.id===id);if(!s)return;editingId=id;
 editForm.innerHTML=`<label>Student ID</label><input value="${escapeAttribute(getStudentId(s))}" readonly>
 <label>Student Name</label><input id="editName" value="${escapeAttribute(s.student_name||"")}">
 <label>Email</label><input id="editEmail" type="email" value="${escapeAttribute(s.student_email||"")}">
 <label>Phone</label><input id="editPhone" value="${escapeAttribute(s.student_phone||"")}">
 <label>Belt Rank</label><select id="editBelt">${["White","Yellow","Green","Blue","Red","Black","Black 1st Dan","Black 2nd Dan","Black 3rd Dan"].map(b=>`<option value="${b}" ${s.belt_rank===b?"selected":""}>${b}</option>`).join("")}</select>
 <label>Status</label><select id="editStatus">${["active","inactive","suspended","graduated"].map(x=>`<option value="${x}" ${s.status===x?"selected":""}>${x}</option>`).join("")}</select>
 <label>Monthly Fee</label><input id="editMonthlyFee" type="number" min="0" step=".01" value="${Number(s.monthly_fee||0)}">
 <label>Monthly Fee Paid</label><input id="editMonthlyPaid" type="number" min="0" step=".01" value="${Number(s.monthly_fee_paid||0)}">
 <label>Medical Information</label><textarea id="editMedical" rows="3">${escapeHTML(s.medical_information||"None")}</textarea>`;
 editModal.style.display="flex";
}
async function saveEdit(){
 const name=editName.value.trim();if(!name){alert("Student name is required.");return}
 const updates={student_name:name,student_email:editEmail.value.trim()||null,student_phone:editPhone.value.trim()||null,belt_rank:editBelt.value,status:editStatus.value,monthly_fee:parseFloat(editMonthlyFee.value)||0,monthly_fee_paid:parseFloat(editMonthlyPaid.value)||0,medical_information:editMedical.value.trim()||"None"};
 const {error}=await supabaseClient.from("students").update(updates).eq("id",editingId);
 if(error){alert("Update failed: "+error.message);return}closeModal();showMessage("Student updated successfully.","success");await loadStudents();
}
async function deleteStudent(id){
 const s=students.find(x=>x.id===id);if(!s)return;if(!confirm(`Delete ${s.student_name}?`))return;
 const {error}=await supabaseClient.from("students").delete().eq("id",id);
 if(error){alert("Delete failed: "+error.message);return}showMessage("Student deleted successfully.","success");await loadStudents();
}
function clearStudentForm(){["sName","sEmail","sPhone","pName","pPhone","pAddress","sEmergency","sMedical","sFeePaid"].forEach(id=>document.getElementById(id).value="");sDay.value="";sMonth.value="";sYear.value="";sGender.value="";sBelt.value="White";sExperience.value="";sRegPaid.checked=false}
function closeModal(){editModal.style.display="none"}
async function logout(){await supabaseClient.auth.signOut();location.href="index.html"}
function showMessage(text,type){message.textContent=text;message.className="message "+type;message.style.display="block";setTimeout(()=>message.style.display="none",5000)}
function escapeHTML(v){return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function escapeAttribute(v){return escapeHTML(v)}
</script>
</body>
</html>
